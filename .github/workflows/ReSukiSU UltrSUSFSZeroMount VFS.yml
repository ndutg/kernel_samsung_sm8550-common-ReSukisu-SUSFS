# ============================================================
# build-kernel-zeromount-exp.yml  (v3 — final attempt)
# [EXPERIMENTAL] ReSukiSU Ultra + SUSFS + ZeroMount VFS
# SM8550 Samsung Galaxy S23 (android13-5.15)
#
# v3 FIX: Do NOT pre-copy susfs source files before patches.
#   Super-Builders 50_ patch CREATES susfs.c, susfs.h, and
#   susfs_def.h — pre-copying caused "file already exists"
#   and cascading patch failures.
#
#   susfs4ksu is now cloned AFTER all patches, only for
#   Kconfig symbol extraction.
#
# Patch chain (all from Super-Builders, version-matched):
#   50_ upstream SUSFS      (creates susfs files + patches VFS)
#   51_ enhanced SUSFS      (bug fixes, hardening, guards)
#   60_ ZeroMount VFS       (path redirection, injection)
# ============================================================

name: "[EXP] Build SM8550 Kernel — ReSukiSU + SUSFS + ZeroMount"

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  packages: write

env:
  KERNEL_BRANCH: android13-5.15
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_BRANCH: gki-android13-5.15
  CLANG_VERSION: r584948
  ZEROMOUNT_REPO: https://github.com/Enginex0/Super-Builders.git
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:

  build:
    name: "ReSukiSU + SUSFS + ZeroMount (experimental v3)"
    runs-on: ubuntu-24.04

    steps:

      # ── 1. Checkout kernel source ───────────────────────────────
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ndutg/kernel_samsung_sm8550-common-ksususfs
          ref: ${{ env.KERNEL_BRANCH }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Install build dependencies ─────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential curl flex \
            g++-multilib gcc-multilib git gnupg \
            lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libssl-dev \
            lzop zlib1g-dev pahole dwarves cpio zip \
            python3 python-is-python3 tar perl lz4 jq

      # ── 3. Restore clang toolchain cache ──────────────────────
      - name: Restore Clang ${{ env.CLANG_VERSION }} from cache
        uses: actions/cache/restore@v4
        with:
          path: clang-toolchain
          key: clang-aosp-${{ env.CLANG_VERSION }}
          fail-on-cache-miss: true

      # ── 4. Verify clang ───────────────────────────────────────
      - name: Verify Clang
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          clang --version || { echo "ERROR: clang not found."; exit 1; }

      # ── 5. Set up ReSukiSU Ultra ─────────────────────────────
      - name: Setup ReSukiSU Ultra
        run: |
          echo "==> Setting up ReSukiSU Ultra..."
          curl -sSfL --retry 3 --connect-timeout 20 \
            "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
            | bash -s "main" \
            || { echo "ERROR: setup.sh failed."; exit 1; }

          KSU_DIR="KernelSU"
          KSU_TAG=$(git -C "${KSU_DIR}" describe --tags --abbrev=0 2>/dev/null \
            || git -C "${KSU_DIR}" tag --list 'v[0-9]*' --sort=-v:refname \
               2>/dev/null | head -1 \
            || echo "main")

          BUILD_SUFFIX="resukisu-zeromount-exp-${KSU_TAG}-manual-hook-kpm"

          echo "KSUDIR=${KSU_DIR}"           >> $GITHUB_ENV
          echo "BUILDSUFFIX=${BUILD_SUFFIX}" >> $GITHUB_ENV

      # ── 6. KPM uapi headers + Dynamic Header Fixes ──────────
      - name: KPM uapi headers + Dynamic Header Fixes
        run: |
          echo "==> Locating kpm.h..."
          KPM_H_PATH=$(find "$KSUDIR" -name "kpm.h" | head -n 1)
          if [ -n "$KPM_H_PATH" ]; then
            echo "Found kpm.h at: $KPM_H_PATH"
            mkdir -p include/uapi/
            cp "$KPM_H_PATH" include/uapi/
          else
            echo "WARNING: kpm.h not found in $KSUDIR"
          fi

          MAIN_MK="drivers/kernelsu/Makefile"
          if [ -f "${MAIN_MK}" ]; then
            if ! grep -q 'ccflags-y += -I$(srctree)/drivers/kernelsu' "${MAIN_MK}"; then
              printf '\nccflags-y += -I$(srctree)/drivers/kernelsu\n' >> "${MAIN_MK}"
            fi
          fi

          echo "==> Scanning for files missing ksu_cred declaration..."
          FILES=$(grep -rl 'ksu_cred' drivers/kernelsu/ | grep '\.c$' || true)
          for file in $FILES; do
            if ! grep -q 'extern struct cred \*ksu_cred' "$file"; then
              { printf '#include <linux/cred.h>\nextern struct cred *ksu_cred;\n'; cat "$file"; } > "${file}.tmp"
              mv "${file}.tmp" "$file"
            fi
          done

          echo "==> Scanning for files missing allow_shell declaration..."
          FILES=$(grep -rlE 'allow_shell|ksu_allow_shell' drivers/kernelsu/ | grep '\.c$' || true)
          for file in $FILES; do
            if ! grep -E -q 'extern.*allow_shell' "$file"; then
              { printf '#include <linux/types.h>\nextern bool ksu_allow_shell;\nextern bool allow_shell;\n'; cat "$file"; } > "${file}.tmp"
              mv "${file}.tmp" "$file"
            fi
          done

          echo "==> Scanning for files missing ksu_late_loaded declaration..."
          FILES=$(grep -rl 'ksu_late_loaded' drivers/kernelsu/ fs/ kernel/ | grep '\.c$' || true)
          for file in $FILES; do
            if ! grep -q 'extern bool ksu_late_loaded' "$file"; then
              { printf '#include <linux/types.h>\nextern bool ksu_late_loaded;\n'; cat "$file"; } > "${file}.tmp"
              mv "${file}.tmp" "$file"
            fi
          done

      # ════════════════════════════════════════════════════════════
      # ── 7. UNIFIED PATCH CHAIN ── ★ v3 FIX ★
      #
      #   v2 bug: Copied susfs.c/susfs.h/susfs_def.h from
      #     susfs4ksu BEFORE the 50_ patch, causing "file
      #     already exists" errors and cascading failures.
      #
      #   v3 fix: Do NOT pre-copy any files. Let the 50_
      #     patch create them. Clone susfs4ksu AFTER patches
      #     for Kconfig extraction only.
      # ════════════════════════════════════════════════════════════
      - name: Apply SUSFS + ZeroMount unified patch chain (v3)
        run: |
          # ── Clone Super-Builders for version-matched patches ──
          echo "==> Cloning Super-Builders for version-matched patch chain..."
          git clone --depth 1 "${{ env.ZEROMOUNT_REPO }}" super-builders \
            || { echo "ERROR: Super-Builders clone failed."; exit 1; }

          # ── Locate patch directory ──
          PATCH_DIR=$(find super-builders -type d -path "*/android13-5.15/ReSukiSU/patches" | head -n 1)
          if [ -z "$PATCH_DIR" ]; then
            echo "WARNING: ReSukiSU patches dir not found, trying any variant..."
            PATCH_DIR=$(find super-builders -type d -path "*/android13-5.15/*/patches" | head -n 1)
          fi

          if [ -z "$PATCH_DIR" ]; then
            echo "ERROR: No android13-5.15 patches directory found!"
            find super-builders -name "*.patch" | sort
            exit 1
          fi

          echo "==> Using patch directory: $PATCH_DIR"
          echo "==> Available patches:"
          ls -la "$PATCH_DIR"/*.patch 2>/dev/null || echo "  (none)"

          PATCH_50=$(find "$PATCH_DIR" -name "50_*.patch" | head -n 1)
          PATCH_51=$(find "$PATCH_DIR" -name "51_*.patch" | head -n 1)
          PATCH_60=$(find "$PATCH_DIR" -name "60_*.patch" | head -n 1)

          # ── Validate all three exist ──
          echo "==> Patch chain:"
          echo "    50_: $PATCH_50"
          echo "    51_: $PATCH_51"
          echo "    60_: $PATCH_60"
          for p in "$PATCH_50" "$PATCH_51" "$PATCH_60"; do
            if [ -z "$p" ] || [ ! -f "$p" ]; then
              echo "ERROR: Required patch missing!"
              find "$PATCH_DIR" -name "*.patch" | sort
              exit 1
            fi
          done

          # ── [1/3] Apply 50_ upstream SUSFS ──
          # This patch CREATES susfs.c, susfs.h, susfs_def.h
          # Do NOT pre-copy those files!
          echo ""
          echo "==> [1/3] Applying 50_ upstream SUSFS patch..."
          echo "    (This patch creates susfs source files + patches kernel VFS)"
          if patch -p1 --forward --fuzz=0 < "$PATCH_50"; then
            echo "==> 50_ applied cleanly (fuzz=0). ✅"
          else
            echo "==> 50_ failed with fuzz=0, retrying with fuzz=3..."
            # Reset any partial application
            patch -p1 --reverse --fuzz=0 < "$PATCH_50" 2>/dev/null || true
            patch -p1 --forward --fuzz=3 < "$PATCH_50" \
              || { echo "ERROR: 50_ SUSFS patch failed completely."; exit 1; }
            echo "==> 50_ applied with fuzz=3. ⚠️ Check hunks above."
          fi

          # Verify susfs files were created by the patch
          for f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do
            if [ -f "$f" ]; then
              echo "    ✅ $f created by patch"
            else
              echo "    ❌ $f NOT created! Patch may be incomplete."
              exit 1
            fi
          done

          # ── [2/3] Apply 51_ enhanced SUSFS ──
          echo ""
          echo "==> [2/3] Applying 51_ enhanced SUSFS patch..."
          if patch -p1 --forward --fuzz=0 < "$PATCH_51"; then
            echo "==> 51_ applied cleanly (fuzz=0). ✅"
          else
            echo "==> 51_ failed with fuzz=0, retrying with fuzz=3..."
            patch -p1 --forward --fuzz=3 < "$PATCH_51" \
              || { echo "ERROR: 51_ enhanced SUSFS patch failed completely."; exit 1; }
            echo "==> 51_ applied with fuzz=3. ⚠️ Check hunks above."
          fi

          # ── [3/3] Apply 60_ ZeroMount VFS ──
          echo ""
          echo "==> [3/3] Applying 60_ ZeroMount VFS kernel patch..."
          if patch -p1 --forward --fuzz=0 < "$PATCH_60"; then
            echo "==> 60_ applied cleanly (fuzz=0). ✅"
          else
            echo "==> 60_ failed with fuzz=0, retrying with fuzz=3..."
            patch -p1 --forward --fuzz=3 < "$PATCH_60" \
              || { echo "ERROR: 60_ ZeroMount patch failed completely."; exit 1; }
            echo "==> 60_ applied with fuzz=3. ⚠️ Check hunks above."
          fi

          # ── Try KSU driver SUSFS integration patch ──
          # Clone susfs4ksu NOW (after patches) for Kconfig + 10_ patch only
          echo ""
          echo "==> Cloning susfs4ksu for Kconfig extraction..."
          git clone --depth 1 \
            "${{ env.SUSFS_REPO }}" \
            -b "${{ env.SUSFS_BRANCH }}" \
            susfs4ksu \
            || { echo "ERROR: susfs4ksu clone failed."; exit 1; }

          KSU_PATCH="susfs4ksu/kernel_patches/10_enable_susfs_for_ksu.patch"
          if [ -f "$KSU_PATCH" ]; then
            echo "==> Attempting KSU driver SUSFS integration patch..."
            if patch -p1 --forward --dry-run < "$KSU_PATCH" >/dev/null 2>&1; then
              patch -p1 --forward < "$KSU_PATCH" \
                || echo "WARNING: KSU driver patch apply failed."
              echo "==> KSU driver SUSFS patch applied."
            else
              echo "==> KSU driver patch conflicts — injecting Kconfig manually."
            fi
          fi

          # ── Dynamic Kconfig injection ──
          KSU_KCONFIG="drivers/kernelsu/Kconfig"
          if [ -f "$KSU_KCONFIG" ]; then
            if ! grep -q 'KSU_SUSFS' "$KSU_KCONFIG"; then
              echo "==> SUSFS Kconfig entries missing — extracting from susfs headers..."
              printf '\nconfig KSU_SUSFS\n\tbool "Enable SUSFS for KernelSU"\n\tdepends on KSU\n\tdefault y\n\thelp\n\t  Patch for SUSFS on KernelSU\n' >> "$KSU_KCONFIG"
              SUSFS_OPTS=$(grep -hroE 'CONFIG_KSU_SUSFS_[A-Z_]+' susfs4ksu/kernel_patches/include/linux/susfs.h susfs4ksu/kernel_patches/fs/susfs.c 2>/dev/null | sort -u | sed 's/CONFIG_KSU_SUSFS_//')
              for opt in $SUSFS_OPTS; do
                DESC=$(echo "$opt" | tr '_' ' ' | tr '[:upper:]' '[:lower:]')
                printf '\nconfig KSU_SUSFS_%s\n\tbool "Enable %s"\n\tdepends on KSU_SUSFS\n\tdefault y\n' "$opt" "$DESC" >> "$KSU_KCONFIG"
              done
              echo "==> SUSFS Kconfig entries injected."
            else
              echo "==> SUSFS Kconfig entries already present."
            fi
          fi

          # ── Report results ──
          echo ""
          echo "==> Checking for new ZeroMount source files..."
          find . -name "*zeromount*" -o -name "*zero_mount*" | grep -v super-builders | grep -v ".patch" || echo "  (none)"

          echo ""
          echo "==> Checking for .rej files (patch rejects)..."
          REJ_COUNT=$(find . -name "*.rej" -not -path "*/super-builders/*" -not -path "*/susfs4ksu/*" | wc -l)
          if [ "$REJ_COUNT" -gt 0 ]; then
            echo "  ❌ Found $REJ_COUNT reject files:"
            find . -name "*.rej" -not -path "*/super-builders/*" -not -path "*/susfs4ksu/*" -exec echo "  REJECT: {}" \; -exec cat {} \;
            echo "::warning::Patch rejects found — review above."
          else
            echo "  ✅ No reject files — all patches applied cleanly."
          fi

          rm -rf susfs4ksu super-builders
          echo "==> Unified patch chain complete."

      # ── 8. Verify patch placement ───────────────────────────
      - name: Verify critical hook placement
        run: |
          echo "==> Verifying ZeroMount hook placement..."
          ISSUES=0

          if [ -f "fs/zeromount.c" ]; then
            LINES=$(wc -l < fs/zeromount.c)
            echo "  ✅ fs/zeromount.c exists ($LINES lines)"
          else
            echo "  ❌ fs/zeromount.c NOT found!"
            ISSUES=1
          fi

          if [ -f "include/linux/zeromount.h" ]; then
            echo "  ✅ include/linux/zeromount.h exists"
          else
            echo "  ❌ include/linux/zeromount.h NOT found!"
            ISSUES=1
          fi

          if grep -q "zeromount" fs/Makefile; then
            echo "  ✅ fs/Makefile has zeromount build entry"
          else
            echo "  ❌ fs/Makefile missing zeromount entry!"
            ISSUES=1
          fi

          if grep -q "ZEROMOUNT" fs/Kconfig; then
            echo "  ✅ fs/Kconfig has ZEROMOUNT entry"
          else
            echo "  ⚠️  fs/Kconfig missing ZEROMOUNT"
          fi

          for f in fs/d_path.c fs/namei.c fs/stat.c fs/readdir.c; do
            if [ -f "$f" ] && grep -q "zeromount.h" "$f"; then
              echo "  ✅ $f includes zeromount.h"
            elif [ -f "$f" ]; then
              echo "  ⚠️  $f does NOT include zeromount.h"
            fi
          done

          if [ "$ISSUES" -gt 0 ]; then
            echo "::error::Critical ZeroMount files missing!"
            exit 1
          fi
          echo "==> Hook placement verification passed."

      # ── 9. Resolve kernel version ───────────────────────────
      - name: Resolve kernel version and date
        id: meta
        run: |
          KVER=$(make kernelversion 2>/dev/null | awk -F. '{print $1"."$2"."$3}')
          echo "kernelversion=${KVER}" >> $GITHUB_OUTPUT
          echo "date=$(date +%Y%m%d)"  >> $GITHUB_OUTPUT

      # ── 10. Set up swap ──────────────────────────────────────
      - name: Set up swap (24 GB)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      # ── 11. Generate defconfig ───────────────────────────────
      - name: Generate defconfig
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            gki_defconfig

      # ── 12. Enable configs ───────────────────────────────────
      - name: Enable SUSFS + KPM + ZeroMount configs
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"

          ./scripts/config --file out/.config -e CONFIG_KSU
          ./scripts/config --file out/.config -e CONFIG_KSU_MANUAL_HOOK

          KSU_KCONFIG="drivers/kernelsu/Kconfig"
          echo "==> Dynamically enabling all SUSFS config options..."
          grep -oE '^config KSU_SUSFS[A-Z_]*' "$KSU_KCONFIG" | while read -r line; do
            OPT="CONFIG_${line#config }"
            echo "  Enabling $OPT"
            ./scripts/config --file out/.config -e "$OPT"
          done

          echo "==> Enabling KPM options..."
          ./scripts/config --file out/.config \
            -e CONFIG_KPM \
            -e CONFIG_KALLSYMS \
            -e CONFIG_KALLSYMS_ALL

          echo "==> Enabling ZeroMount..."
          ./scripts/config --file out/.config -e CONFIG_ZEROMOUNT

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            olddefconfig

      # ── 13. Verify config ───────────────────────────────────
      - name: Verify kernel config
        run: |
          echo "==> Verifying kernel config options..."
          CONFIG="out/.config"
          KSU_KCONFIG="drivers/kernelsu/Kconfig"
          FAILED=0

          for opt in CONFIG_KSU CONFIG_KSU_SUSFS CONFIG_KPM CONFIG_KALLSYMS CONFIG_KALLSYMS_ALL CONFIG_ZEROMOUNT; do
            if grep -q "${opt}=y" "$CONFIG"; then
              echo "  ✅ ${opt}=y"
            else
              echo "  ❌ ${opt}=y is MISSING!"
              FAILED=1
            fi
          done

          echo "  --- SUSFS sub-options ---"
          grep -oE '^config KSU_SUSFS_[A-Z_]+' "$KSU_KCONFIG" 2>/dev/null | while read -r line; do
            OPT="CONFIG_${line#config }"
            if grep -q "${OPT}=y" "$CONFIG"; then
              echo "  ✅ ${OPT}=y"
            else
              echo "  ⚠️  ${OPT}=y not set"
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::Critical config options MISSING!"
            grep -E 'CONFIG_KSU|CONFIG_KPM|CONFIG_KALLSYMS|CONFIG_ZEROMOUNT' "$CONFIG" || true
            exit 1
          fi
          echo "==> Config verification complete."

      # ── 14. Patch headers ────────────────────────────────────
      - name: Patch Header Refactors
        run: |
          echo "==> Applying fixes for missing KSU identifiers..."
          sed -i '/#include <linux\/cred.h>/a \
          extern struct cred *ksu_cred;\
          extern bool allow_shell;\
          extern bool ksu_late_loaded;' include/linux/cred.h

          sed -i '/#include <linux\/types.h>/a \
          extern bool ksu_late_loaded;' include/linux/sched.h
          echo "==> Headers patched successfully."

      # ── 15. Bridge stubs ─────────────────────────────────────
      - name: Create KSU hook bridge stubs
        run: |
          echo "==> Creating bridge stubs for pre-baked KSU hooks..."
          printf '%s\n' \
            '#include <linux/types.h>' \
            '#include <linux/fs.h>' \
            '#include <linux/version.h>' \
            'int __attribute__((weak)) ksu_handle_sys_reboot(void) { return 0; }' \
            'int __attribute__((weak)) ksu_handle_sys_read(unsigned int fd, char __user *buf, size_t count) { return 0; }' \
            'int __attribute__((weak)) ksu_handle_vfs_fstat(int fd, struct kstat *stat) { return 0; }' \
            'int __attribute__((weak)) ksu_handle_devpts(struct inode *inode) { return 0; }' \
            'int __attribute__((weak)) ksu_input_hook(void *dev, unsigned int type, unsigned int code, int value) { return 0; }' \
            'int __attribute__((weak)) ksu_execveat_hook(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags) { return 0; }' \
            'int __attribute__((weak)) ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags) { return 0; }' \
            'int __attribute__((weak)) ksu_handle_execveat_sucompat(int *fd, const char __user **filename_user, void *argv, void *envp, int *flags) { return 0; }' \
            'int __attribute__((weak)) ksu_init_rc_hook(const char *data, unsigned long count) { return 0; }' \
            'bool __attribute__((weak)) susfs_is_current_ksu_domain(void) { return true; }' \
            'unsigned int __attribute__((weak)) susfs_ksu_sid;' \
            'unsigned int __attribute__((weak)) susfs_priv_app_sid;' \
            > kernel/ksu_hooks_bridge.c

          if ! grep -q 'ksu_hooks_bridge' kernel/Makefile; then
            echo 'obj-y += ksu_hooks_bridge.o' >> kernel/Makefile
          fi

          echo "==> Bridge stubs created."
          grep 'ksu_hooks_bridge' kernel/Makefile || echo "WARNING: Entry not found!"

      # ── 16. Build kernel ─────────────────────────────────────
      - name: Build kernel (ReSukiSU + SUSFS + ZeroMount)
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          echo "==> Compiling: ReSukiSU + SUSFS + ZeroMount [${BUILDSUFFIX}]..."
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1

      # ── 17. Post-build verify ───────────────────────────────
      - name: Verify SUSFS, KPM, and ZeroMount objects
        run: |
          echo "==> Post-build verification..."
          FAILED=0

          if find out/ -name "susfs.o" | grep -q .; then
            echo "  ✅ susfs.o found"
          else
            echo "  ❌ susfs.o NOT found!"
            FAILED=1
          fi

          if find out/ -name "zeromount.o" | grep -q .; then
            echo "  ✅ zeromount.o found"
          else
            echo "  ❌ zeromount.o NOT found!"
            FAILED=1
          fi

          if find out/ -path "*/kernelsu/kpm/*.o" | grep -q .; then
            echo "  ✅ KPM objects found"
          else
            echo "  ❌ KPM objects NOT found!"
            FAILED=1
          fi

          if [ -f out/arch/arm64/boot/Image ] || [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "  ✅ Kernel image found"
          else
            echo "  ❌ Kernel image NOT found!"
            FAILED=1
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::Post-build verification FAILED!"
            exit 1
          fi
          echo "==> All post-build checks passed."

      # ── 18. Package AnyKernel3 ───────────────────────────────
      - name: Package AnyKernel3 ZIP
        run: |
          cp .github/goodies/AnyKernel3.zip .
          unzip AnyKernel3.zip -d AnyKernel3
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/
          else
            echo "ERROR: No kernel Image found"
            exit 1
          fi

      # ── 19. Upload artifact ─────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm8550-${{ steps.meta.outputs.kernelversion }}-${{ env.BUILDSUFFIX }}-susfs-zeromount-${{ steps.meta.outputs.date }}
          path: AnyKernel3
          compression-level: 9
          if-no-files-found: warn
          overwrite: false
