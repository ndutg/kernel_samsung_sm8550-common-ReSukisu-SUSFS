# ============================================================
# build-kernel-zeromount-exp.yml
# [EXPERIMENTAL] ReSukiSU Ultra + SUSFS + ZeroMount VFS
# SM8550 Samsung Galaxy S23 (android13-5.15)
#
# This is an experimental build to test ZeroMount VFS kernel
# driver integration. The ZeroMount patch hooks into the VFS
# getname() path for mountless module loading.
#
# Base: working build-kernel-final.yml (ReSukiSU variant)
# Added: ZeroMount VFS patch from Enginex0/Super-Builders
#
# KNOWN RISKS:
#   - ZeroMount patch targets stock GKI, not Samsung OEM kernel
#   - May conflict with Samsung VFS modifications
#   - If 60_zeromount depends on 51_enhanced_susfs symbols,
#     build will fail (add 51_ patch in next iteration)
# ============================================================

name: "[EXP] Build SM8550 Kernel — ReSukiSU + SUSFS + ZeroMount"

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  packages: write

env:
  KERNEL_BRANCH: android13-5.15
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_BRANCH: gki-android13-5.15
  CLANG_VERSION: r584948
  ZEROMOUNT_REPO: https://github.com/Enginex0/Super-Builders.git
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:

  build:
    name: "ReSukiSU + SUSFS + ZeroMount (experimental)"
    runs-on: ubuntu-24.04

    steps:

      # ── 1. Checkout kernel source ───────────────────────────────
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ndutg/kernel_samsung_sm8550-common-ksususfs
          ref: ${{ env.KERNEL_BRANCH }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Install build dependencies ─────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential curl flex \
            g++-multilib gcc-multilib git gnupg \
            lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libssl-dev \
            lzop zlib1g-dev pahole dwarves cpio zip \
            python3 python-is-python3 tar perl lz4 jq

      # ── 3. Restore clang toolchain cache ──────────────────────
      - name: Restore Clang ${{ env.CLANG_VERSION }} from cache
        uses: actions/cache/restore@v4
        with:
          path: clang-toolchain
          key: clang-aosp-${{ env.CLANG_VERSION }}
          fail-on-cache-miss: true

      # ── 4. Verify clang ───────────────────────────────────────
      - name: Verify Clang
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          clang --version || { echo "ERROR: clang not found."; exit 1; }

      # ── 5. Set up ReSukiSU Ultra ─────────────────────────────
      - name: Setup ReSukiSU Ultra
        id: ksu
        run: |
          echo "==> Setting up ReSukiSU Ultra..."
          curl -sSfL --retry 3 --connect-timeout 20 \
            "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
            | bash -s "main" \
            || { echo "ERROR: setup.sh failed."; exit 1; }

          KSU_DIR="KernelSU"
          KSU_TAG=$(git -C "${KSU_DIR}" describe --tags --abbrev=0 2>/dev/null \
            || git -C "${KSU_DIR}" tag --list 'v[0-9]*' --sort=-v:refname \
               2>/dev/null | head -1 \
            || echo "main")

          BUILD_SUFFIX="resukisu-zeromount-exp-${KSU_TAG}-manual-hook-kpm"

          echo "KSUDIR=${KSU_DIR}"           >> $GITHUB_ENV
          echo "BUILDSUFFIX=${BUILD_SUFFIX}" >> $GITHUB_ENV

      # ── 6. KPM uapi headers + Dynamic Header Fixes ──────────
      - name: KPM uapi headers + Dynamic Header Fixes
        run: |
          echo "==> Locating kpm.h..."
          KPM_H_PATH=$(find "$KSUDIR" -name "kpm.h" | head -n 1)
          if [ -n "$KPM_H_PATH" ]; then
            echo "Found kpm.h at: $KPM_H_PATH"
            mkdir -p include/uapi/
            cp "$KPM_H_PATH" include/uapi/
          else
            echo "WARNING: kpm.h not found in $KSUDIR"
          fi

          MAIN_MK="drivers/kernelsu/Makefile"
          if [ -f "${MAIN_MK}" ]; then
            if ! grep -q 'ccflags-y += -I$(srctree)/drivers/kernelsu' "${MAIN_MK}"; then
              printf '\nccflags-y += -I$(srctree)/drivers/kernelsu\n' >> "${MAIN_MK}"
            fi
          fi

          echo "==> Scanning for files missing ksu_cred declaration..."
          FILES=$(grep -rl 'ksu_cred' drivers/kernelsu/ | grep '\.c$' || true)
          for file in $FILES; do
            if ! grep -q 'extern struct cred \*ksu_cred' "$file"; then
              { printf '#include <linux/cred.h>\nextern struct cred *ksu_cred;\n'; cat "$file"; } > "${file}.tmp"
              mv "${file}.tmp" "$file"
            fi
          done

          echo "==> Scanning for files missing allow_shell declaration..."
          FILES=$(grep -rlE 'allow_shell|ksu_allow_shell' drivers/kernelsu/ | grep '\.c$' || true)
          for file in $FILES; do
            if ! grep -E -q 'extern.*allow_shell' "$file"; then
              { printf '#include <linux/types.h>\nextern bool ksu_allow_shell;\nextern bool allow_shell;\n'; cat "$file"; } > "${file}.tmp"
              mv "${file}.tmp" "$file"
            fi
          done

          echo "==> Scanning for files missing ksu_late_loaded declaration..."
          FILES=$(grep -rl 'ksu_late_loaded' drivers/kernelsu/ fs/ kernel/ | grep '\.c$' || true)
          for file in $FILES; do
            if ! grep -q 'extern bool ksu_late_loaded' "$file"; then
              { printf '#include <linux/types.h>\nextern bool ksu_late_loaded;\n'; cat "$file"; } > "${file}.tmp"
              mv "${file}.tmp" "$file"
            fi
          done

      # ── 7. Apply SUSFS patches ───────────────────────────────
      - name: Apply SUSFS patches
        run: |
          git clone --depth 1 \
            "${{ env.SUSFS_REPO }}" \
            -b "${{ env.SUSFS_BRANCH }}" \
            susfs4ksu \
            || { echo "ERROR: SUSFS clone failed."; exit 1; }

          cp susfs4ksu/kernel_patches/fs/susfs.c                fs/
          cp susfs4ksu/kernel_patches/include/linux/susfs.h     include/linux/
          cp susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/

          patch -p1 --forward \
            < "susfs4ksu/kernel_patches/50_add_susfs_in_${{ env.SUSFS_BRANCH }}.patch" \
            || { echo "ERROR: SUSFS kernel patch failed."; exit 1; }

          KSU_PATCH="susfs4ksu/kernel_patches/10_enable_susfs_for_ksu.patch"
          if [ -f "$KSU_PATCH" ]; then
            echo "==> Attempting KSU driver SUSFS integration patch..."
            if patch -p1 --forward --dry-run < "$KSU_PATCH" >/dev/null 2>&1; then
              patch -p1 --forward < "$KSU_PATCH" \
                || echo "WARNING: KSU driver patch apply failed (will inject Kconfig manually)."
              echo "==> KSU driver SUSFS patch applied successfully."
            else
              echo "==> KSU driver patch already applied or conflicts — injecting Kconfig entries manually."
            fi
          else
            echo "WARNING: $KSU_PATCH not found — will inject Kconfig entries manually."
          fi

          # ── Dynamic Kconfig injection ──
          KSU_KCONFIG="drivers/kernelsu/Kconfig"
          if [ -f "$KSU_KCONFIG" ]; then
            if ! grep -q 'KSU_SUSFS' "$KSU_KCONFIG"; then
              echo "==> SUSFS Kconfig entries missing — extracting from susfs headers..."
              printf '\nconfig KSU_SUSFS\n\tbool "Enable SUSFS for KernelSU"\n\tdepends on KSU\n\tdefault y\n\thelp\n\t  Patch for SUSFS on KernelSU\n' >> "$KSU_KCONFIG"
              SUSFS_OPTS=$(grep -hroE 'CONFIG_KSU_SUSFS_[A-Z_]+' susfs4ksu/kernel_patches/include/linux/susfs.h susfs4ksu/kernel_patches/fs/susfs.c 2>/dev/null | sort -u | sed 's/CONFIG_KSU_SUSFS_//')
              echo "==> Found SUSFS sub-options: $SUSFS_OPTS"
              for opt in $SUSFS_OPTS; do
                DESC=$(echo "$opt" | tr '_' ' ' | tr '[:upper:]' '[:lower:]')
                printf '\nconfig KSU_SUSFS_%s\n\tbool "Enable %s"\n\tdepends on KSU_SUSFS\n\tdefault y\n' "$opt" "$DESC" >> "$KSU_KCONFIG"
              done
              echo "==> SUSFS Kconfig entries injected dynamically."
            else
              echo "==> SUSFS Kconfig entries already present."
            fi
          else
            echo "ERROR: KernelSU Kconfig not found at $KSU_KCONFIG"
            exit 1
          fi

          rm -rf susfs4ksu

      # ════════════════════════════════════════════════════════════
      # ── 8. ZEROMOUNT VFS PATCH ── ★ EXPERIMENTAL ★
      #
      #   Applies the ZeroMount VFS kernel driver patch from
      #   Enginex0/Super-Builders. This hooks into getname()
      #   at the VFS layer for mountless module loading.
      #
      #   Must be applied AFTER SUSFS (patches may touch
      #   overlapping files). Order matches Super-Builders:
      #   50_susfs -> 60_zeromount
      #
      #   RISK: Patch targets stock GKI. Samsung OEM kernel
      #   may have VFS modifications that cause conflicts.
      # ════════════════════════════════════════════════════════════
      - name: Apply ZeroMount VFS kernel patch (experimental)
        run: |
          echo "==> Cloning Super-Builders for ZeroMount patch..."
          git clone --depth 1 "${{ env.ZEROMOUNT_REPO }}" super-builders \
            || { echo "ERROR: Super-Builders clone failed."; exit 1; }

          # Locate the ZeroMount patch dynamically
          echo "==> Searching for ZeroMount patch..."
          ZM_PATCH=$(find super-builders -name "60_zeromount*.patch" -path "*/android13-5.15/*" | head -n 1)

          if [ -z "$ZM_PATCH" ]; then
            echo "ERROR: ZeroMount patch not found in Super-Builders!"
            echo "==> Available patches:"
            find super-builders -name "*.patch" | sort
            exit 1
          fi

          echo "==> Found ZeroMount patch: $ZM_PATCH"
          echo "==> Patch file content summary:"
          head -50 "$ZM_PATCH"
          echo ""
          echo "==> Files modified by this patch:"
          grep "^diff --git" "$ZM_PATCH" || true
          echo ""

          # Also check if Super-Builders has an enhanced SUSFS patch
          # that ZeroMount might depend on
          ENH_SUSFS=$(find super-builders -name "51_enhanced_susfs*.patch" -path "*/android13-5.15/*" | head -n 1)
          if [ -n "$ENH_SUSFS" ]; then
            echo "==> Found enhanced SUSFS patch: $ENH_SUSFS"
            echo "==> Applying enhanced SUSFS patch first (ZeroMount may depend on it)..."
            echo "==> Files modified by enhanced SUSFS patch:"
            grep "^diff --git" "$ENH_SUSFS" || true
            if patch -p1 --forward --dry-run < "$ENH_SUSFS" >/dev/null 2>&1; then
              patch -p1 --forward < "$ENH_SUSFS" \
                || echo "WARNING: Enhanced SUSFS patch had issues — continuing anyway."
              echo "==> Enhanced SUSFS patch applied."
            else
              echo "==> Enhanced SUSFS patch conflicts with existing SUSFS — skipping."
              echo "    (If ZeroMount fails to compile, this is likely why.)"
            fi
          else
            echo "==> No enhanced SUSFS patch found — proceeding with standard SUSFS."
          fi

          # Apply ZeroMount VFS patch
          echo "==> Applying ZeroMount VFS kernel patch..."
          if patch -p1 --forward --fuzz=3 < "$ZM_PATCH"; then
            echo "==> ZeroMount VFS patch applied successfully."
          else
            echo "==> ZeroMount patch had conflicts!"
            echo "==> Listing rejected hunks:"
            find . -name "*.rej" -exec echo "  REJECT: {}" \; -exec cat {} \;
            echo ""
            echo "::error::ZeroMount VFS patch failed to apply cleanly."
            echo "This likely means the Samsung OEM kernel has VFS modifications"
            echo "that are incompatible with the stock GKI-targeted patch."
            exit 1
          fi

          # Dynamically detect ZeroMount Kconfig options from the patch
          echo "==> Checking for ZeroMount Kconfig requirements..."
          ZM_CONFIGS=$(grep -hroE 'CONFIG_[A-Z_]*ZEROMOUNT[A-Z_]*' "$ZM_PATCH" 2>/dev/null | sort -u || true)
          if [ -n "$ZM_CONFIGS" ]; then
            echo "==> Found ZeroMount config options in patch: $ZM_CONFIGS"
          else
            echo "==> No CONFIG_*ZEROMOUNT* entries found in patch."
            echo "    ZeroMount may use a different config name or be always-on."
          fi

          # Also check if the patch adds its own Kconfig file
          ZM_KCONFIG=$(find . -path "*/zeromount/Kconfig" -o -path "*/zeromount*/Kconfig" 2>/dev/null | head -n 1)
          if [ -n "$ZM_KCONFIG" ]; then
            echo "==> ZeroMount Kconfig found at: $ZM_KCONFIG"
            cat "$ZM_KCONFIG"
          fi

          # Check if the patch added any new source files
          echo "==> Checking for new ZeroMount source files..."
          find . -name "*zeromount*" -o -name "*zero_mount*" | grep -v super-builders | grep -v ".patch" || echo "  (none found — patch modifies existing files only)"

          rm -rf super-builders
          echo "==> ZeroMount integration complete."

      # ── 9. Resolve kernel version and date ───────────────────
      - name: Resolve kernel version and date
        id: meta
        run: |
          KVER=$(make kernelversion 2>/dev/null | awk -F. '{print $1"."$2"."$3}')
          echo "kernelversion=${KVER}" >> $GITHUB_OUTPUT
          echo "date=$(date +%Y%m%d)"  >> $GITHUB_OUTPUT

      # ── 10. Set up swap (24 GB) ─────────────────────────────
      - name: Set up swap (24 GB)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      # ── 11. Generate defconfig ───────────────────────────────
      - name: Generate defconfig
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            gki_defconfig

      # ── 12. Enable SUSFS + KPM + ZeroMount configs ──────────
      - name: Dynamically enable SUSFS + KPM + ZeroMount configs
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"

          # Always enable KSU base + manual hook
          ./scripts/config --file out/.config -e CONFIG_KSU
          ./scripts/config --file out/.config -e CONFIG_KSU_MANUAL_HOOK

          # Dynamically enable ALL KSU_SUSFS options found in Kconfig
          KSU_KCONFIG="drivers/kernelsu/Kconfig"
          echo "==> Dynamically enabling all SUSFS config options..."
          grep -oE '^config KSU_SUSFS[A-Z_]*' "$KSU_KCONFIG" | while read -r line; do
            OPT="CONFIG_${line#config }"
            echo "  Enabling $OPT"
            ./scripts/config --file out/.config -e "$OPT"
          done

          # Enable KPM
          echo "==> Enabling KPM options..."
          ./scripts/config --file out/.config \
            -e CONFIG_KPM \
            -e CONFIG_KALLSYMS \
            -e CONFIG_KALLSYMS_ALL

          # Try to enable ZeroMount if Kconfig entry exists
          echo "==> Attempting to enable ZeroMount config options..."
          for zm_opt in CONFIG_ZEROMOUNT CONFIG_KSU_ZEROMOUNT CONFIG_ZERO_MOUNT; do
            if grep -rq "${zm_opt#CONFIG_}" drivers/kernelsu/Kconfig fs/Kconfig 2>/dev/null; then
              echo "  Found ${zm_opt} in Kconfig — enabling."
              ./scripts/config --file out/.config -e "$zm_opt"
            else
              echo "  ${zm_opt} not found in Kconfig — skipping."
            fi
          done

          # Also scan for any CONFIG_ options the ZeroMount patch added
          echo "==> Scanning all Kconfig files for zeromount-related options..."
          ZM_OPTS=$(grep -rhoE '^config [A-Z_]*[Zz][Ee][Rr][Oo][Mm][Oo][Uu][Nn][Tt][A-Z_]*' drivers/ fs/ kernel/ 2>/dev/null | sort -u || true)
          if [ -n "$ZM_OPTS" ]; then
            echo "==> Found zeromount Kconfig entries:"
            echo "$ZM_OPTS" | while read -r line; do
              OPT="CONFIG_${line#config }"
              echo "  Enabling $OPT"
              ./scripts/config --file out/.config -e "$OPT"
            done
          else
            echo "  No zeromount-specific Kconfig entries found."
            echo "  ZeroMount may compile unconditionally or use an existing config gate."
          fi

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            olddefconfig

      # ── 13. Verify kernel config (dynamic) ───────────────────
      - name: Verify kernel config (dynamic)
        run: |
          echo "==> Verifying kernel config options..."
          CONFIG="out/.config"
          KSU_KCONFIG="drivers/kernelsu/Kconfig"
          FAILED=0

          # Mandatory: CONFIG_KSU
          if grep -q 'CONFIG_KSU=y' "$CONFIG"; then
            echo "  ✅ CONFIG_KSU=y"
          else
            echo "  ❌ CONFIG_KSU=y is MISSING!"
            FAILED=1
          fi

          # Mandatory: CONFIG_KSU_SUSFS
          if grep -q 'CONFIG_KSU_SUSFS=y' "$CONFIG"; then
            echo "  ✅ CONFIG_KSU_SUSFS=y"
          else
            echo "  ❌ CONFIG_KSU_SUSFS=y is MISSING!"
            FAILED=1
          fi

          # Dynamic: verify all KSU_SUSFS sub-options
          echo "  --- SUSFS sub-options ---"
          grep -oE '^config KSU_SUSFS_[A-Z_]+' "$KSU_KCONFIG" | while read -r line; do
            OPT="CONFIG_${line#config }"
            if grep -q "${OPT}=y" "$CONFIG"; then
              echo "  ✅ ${OPT}=y"
            else
              echo "  ⚠️  ${OPT}=y not set (may have been dropped by olddefconfig)"
            fi
          done

          # Hook mode
          echo "  --- Hook mode ---"
          if grep -q 'CONFIG_KSU_MANUAL_HOOK=y' "$CONFIG"; then
            echo "  ✅ CONFIG_KSU_MANUAL_HOOK=y (inline hook mode)"
          else
            echo "  ℹ️  CONFIG_KSU_MANUAL_HOOK not in .config (driver may handle hooks internally)"
          fi

          # KPM
          echo "  --- KPM options ---"
          for opt in CONFIG_KPM CONFIG_KALLSYMS CONFIG_KALLSYMS_ALL; do
            if grep -q "${opt}=y" "$CONFIG"; then
              echo "  ✅ ${opt}=y"
            else
              echo "  ❌ ${opt}=y is MISSING!"
              FAILED=1
            fi
          done

          # ZeroMount (informational only — not a hard failure)
          echo "  --- ZeroMount options ---"
          ZM_IN_CONFIG=$(grep -iE 'zeromount|zero_mount' "$CONFIG" || true)
          if [ -n "$ZM_IN_CONFIG" ]; then
            echo "  ✅ ZeroMount config entries found:"
            echo "$ZM_IN_CONFIG" | while read -r line; do echo "     $line"; done
          else
            echo "  ℹ️  No ZeroMount-specific config entries in .config."
            echo "     ZeroMount VFS driver may compile unconditionally via Makefile."
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "::error::One or more CRITICAL config options are MISSING!"
            echo "==> Dumping KSU/KPM config for debugging:"
            grep -E 'CONFIG_KSU|CONFIG_KPM|CONFIG_KALLSYMS' "$CONFIG" || echo "(none found)"
            exit 1
          fi

          echo ""
          echo "==> Config verification complete."

      # ── 14. Patch Header Refactors ───────────────────────────
      - name: Patch Header Refactors
        run: |
          echo "==> Applying fixes for missing KSU identifiers..."
          sed -i '/#include <linux\/cred.h>/a \
          extern struct cred *ksu_cred;\
          extern bool allow_shell;\
          extern bool ksu_late_loaded;' include/linux/cred.h

          sed -i '/#include <linux\/types.h>/a \
          extern bool ksu_late_loaded;' include/linux/sched.h
          echo "==> Headers patched successfully."

      # ── 15. Create KSU hook bridge stubs ─────────────────────
      - name: Create KSU hook bridge stubs
        run: |
          echo "==> Creating bridge stubs for pre-baked KSU hooks..."
          printf '%s\n' \
            '#include <linux/types.h>' \
            '#include <linux/fs.h>' \
            '#include <linux/version.h>' \
            'int __attribute__((weak)) ksu_handle_sys_reboot(void) { return 0; }' \
            'int __attribute__((weak)) ksu_handle_sys_read(unsigned int fd, char __user *buf, size_t count) { return 0; }' \
            'int __attribute__((weak)) ksu_handle_vfs_fstat(int fd, struct kstat *stat) { return 0; }' \
            'int __attribute__((weak)) ksu_handle_devpts(struct inode *inode) { return 0; }' \
            'int __attribute__((weak)) ksu_input_hook(void *dev, unsigned int type, unsigned int code, int value) { return 0; }' \
            'int __attribute__((weak)) ksu_execveat_hook(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags) { return 0; }' \
            'int __attribute__((weak)) ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags) { return 0; }' \
            'int __attribute__((weak)) ksu_handle_execveat_sucompat(int *fd, const char __user **filename_user, void *argv, void *envp, int *flags) { return 0; }' \
            'int __attribute__((weak)) ksu_init_rc_hook(const char *data, unsigned long count) { return 0; }' \
            'bool __attribute__((weak)) susfs_is_current_ksu_domain(void) { return true; }' \
            'unsigned int __attribute__((weak)) susfs_ksu_sid;' \
            'unsigned int __attribute__((weak)) susfs_priv_app_sid;' \
            > kernel/ksu_hooks_bridge.c

          if ! grep -q 'ksu_hooks_bridge' kernel/Makefile; then
            echo 'obj-y += ksu_hooks_bridge.o' >> kernel/Makefile
          fi

          echo "==> Bridge stubs created."
          grep 'ksu_hooks_bridge' kernel/Makefile || echo "WARNING: Entry not found!"

      # ── 16. Build kernel ─────────────────────────────────────
      - name: Build kernel (ReSukiSU + SUSFS + ZeroMount)
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          echo "==> Compiling: ReSukiSU + SUSFS + ZeroMount [${BUILDSUFFIX}]..."
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1

      # ── 17. Verify SUSFS, KPM, and ZeroMount objects ────────
      - name: Verify SUSFS, KPM, and ZeroMount objects
        run: |
          echo "==> Post-build verification..."
          FAILED=0

          if find out/ -name "susfs.o" | grep -q .; then
            echo "  ✅ fs/susfs.o found — SUSFS was compiled."
          else
            echo "  ❌ fs/susfs.o NOT found — SUSFS was NOT compiled!"
            FAILED=1
          fi

          if find out/ -path "*/kernelsu/kpm/*.o" | grep -q .; then
            echo "  ✅ KPM objects found — KPM was compiled."
          else
            echo "  ❌ KPM objects NOT found — KPM was NOT compiled!"
            FAILED=1
          fi

          # ZeroMount object check (informational — we don't know the exact .o name yet)
          ZM_OBJ=$(find out/ -iname "*zeromount*" -name "*.o" 2>/dev/null || true)
          if [ -n "$ZM_OBJ" ]; then
            echo "  ✅ ZeroMount objects found:"
            echo "$ZM_OBJ" | while read -r f; do echo "     $f"; done
          else
            echo "  ℹ️  No ZeroMount-specific .o files found."
            echo "     VFS hooks may be compiled into existing objects (e.g., fs/namei.o)."
          fi

          if [ -f out/arch/arm64/boot/Image.gz ] || [ -f out/arch/arm64/boot/Image ]; then
            echo "  ✅ Kernel image found."
          else
            echo "  ❌ Kernel image NOT found!"
            FAILED=1
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::Post-build verification FAILED!"
            exit 1
          fi

          echo "==> All post-build checks passed."

      # ── 18. Package AnyKernel3 ZIP ───────────────────────────
      - name: Package AnyKernel3 ZIP
        run: |
          cp .github/goodies/AnyKernel3.zip .
          unzip AnyKernel3.zip -d AnyKernel3
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/
          else
            echo "ERROR: No kernel Image found"
            exit 1
          fi

      # ── 19. Upload artifact ─────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm8550-${{ steps.meta.outputs.kernelversion }}-${{ env.BUILDSUFFIX }}-susfs-zeromount-${{ steps.meta.outputs.date }}
          path: AnyKernel3
