# ============================================================================
#  SM8550 Kernel Matrix Build
#  Builds three root variants in parallel — all with SUSFS
#
#  Variants:
#    1. KernelSU-Next  (stable branch)     → ksun-stable-*
#    2. SukiSU Ultra   (susfs-main branch) → sukisu-susfs-*
#    3. ReSukiSU       (main branch)       → resukisu-*
#
#  All three variants ship SUSFS driver integration on their respective
#  branches, so SUSFS_SKIP_KSU_DRIVER_PATCH=true for all.
#  The kernel-side fs/ SUSFS patch (50addsusfsin*.patch) is always applied.
#
#  Artifact naming:
#    sm8550-<kernelver>-<variant>-<ksu-tag>-kprobes-susfs-<date>
#
#  File location in your repo: .github/workflows/build-kernel-matrix.yml
# ============================================================================

name: Build SM8550 Kernel — KSU Matrix

on:
  workflow_dispatch:

permissions:
  contents: write
  actions:  write
  packages: write

env:
  KERNEL_REPO:   https://github.com/ndutg/kernel_samsung_sm8550-common-ksususfs
  KERNEL_BRANCH: android13-5.15
  SUSFS_REPO:    https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_BRANCH:  gki-android13-5.15
  CLANG_VERSION: r584948

jobs:
  build:
    name: ${{ matrix.display_name }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false          # don't cancel siblings if one variant fails
      matrix:
        include:

          # ── 1. KernelSU-Next stable ─────────────────────────────────────
          - variant:         ksun-stable
            display_name:    "KernelSU-Next (stable)"
            setup_url:       "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/stable/kernel/setup.sh"
            setup_arg:       stable
            ksu_dir:         KernelSU-Next
            artifact_prefix: ksun-stable
            skip_drv_patch:  "true"
            # KSU-Next ships susfsd.rs daemon built-in on stable branch.
            # sulog.o renamed to tinysulog.o — driver patch would conflict.

          # ── 2. SukiSU Ultra (susfs-main) ────────────────────────────────
          - variant:         sukisu-ultra
            display_name:    "SukiSU Ultra (susfs-main)"
            setup_url:       "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh"
            setup_arg:       susfs-main
            ksu_dir:         KernelSU
            artifact_prefix: sukisu-susfs
            skip_drv_patch:  "true"
            # susfs-main branch has SUSFS driver integration built-in.
            # Kernel-side fs/ patch (50addsusfsin*.patch) still applied below.

          # ── 3. ReSukiSU (main) ──────────────────────────────────────────
          - variant:         resukisu
            display_name:    "ReSukiSU (main)"
            setup_url:       "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh"
            setup_arg:       main
            ksu_dir:         KernelSU
            artifact_prefix: resukisu
            skip_drv_patch:  "true"
            # ReSukiSU is derived from SukiSU Ultra — SUSFS driver built-in.
            # NOTE: If this variant fails at setup, verify that ReSukiSU's
            # main branch includes SUSFS. If not, change setup_arg to
            # "susfs-main" (if that branch exists in their repo).

    steps:

      # ── Step 1: Checkout kernel source ──────────────────────────────────
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ndutg/kernel_samsung_sm8550-common-ksususfs
          ref:         ${{ env.KERNEL_BRANCH }}
          fetch-depth: 1
          token:       ${{ secrets.GITHUB_TOKEN }}

      # ── Step 2: Install build dependencies + AOSP Clang r584948 ─────────
      - name: Install dependencies and Clang ${{ env.CLANG_VERSION }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential curl flex \
            g++-multilib gcc-multilib git gnupg \
            lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libssl-dev \
            lzop zlib1g-dev pahole dwarves cpio zip \
            python3 python-is-python3 tar perl lz4 jq

          echo "Downloading AOSP Clang ${{ env.CLANG_VERSION }}..."
          curl -sSfL --retry 3 --connect-timeout 20 \
            -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/mirror-goog-main-llvm-toolchain-source/clang-${{ env.CLANG_VERSION }}.tar.gz" \
          || { echo "ERROR: Failed to download AOSP Clang ${{ env.CLANG_VERSION }}. Aborting."; exit 1; }

          mkdir -p clang-toolchain
          tar -xf clang.tar.gz -C clang-toolchain
          rm -f clang.tar.gz

      # ── Step 3: Setup KSU variant (matrix-driven) ────────────────────────
      # Each setup.sh clones the respective KSU repo, symlinks the driver
      # into the kernel tree, and modifies Makefile + Kconfig automatically.
      - name: Setup ${{ matrix.display_name }}
        id: ksu
        run: |
          echo "==> Setting up ${{ matrix.display_name }}..."
          curl -sSfL --retry 3 --connect-timeout 20 \
            "${{ matrix.setup_url }}" \
            | bash -s "${{ matrix.setup_arg }}" \
          || { echo "ERROR: Failed to fetch or run setup.sh for ${{ matrix.display_name }}."; exit 1; }

          KSU_DIR="${{ matrix.ksu_dir }}"

          # Detect version tag from the cloned KSU directory
          if [ -d "${KSU_DIR}" ]; then
            KSU_TAG=$(git -C "${KSU_DIR}" tag --list 'v[0-9]*' \
                          --sort=-v:refname 2>/dev/null | head -1 || true)
            KSU_NUMERIC=$(grep -rh 'KSU_VERSION\b\|KERNELSU_VERSION\b' \
                              "${KSU_DIR}/kernel/ksu.h" \
                              "${KSU_DIR}/kernel/version.h" 2>/dev/null \
                          | grep -oP '\b[0-9]{4,5}\b' | head -1 || true)
          fi
          [ -z "${KSU_TAG:-}" ]     && KSU_TAG="$(git -C "${KSU_DIR}" describe --tags --abbrev=0 2>/dev/null || echo main)"
          [ -z "${KSU_NUMERIC:-}" ] && KSU_NUMERIC="$(git -C "${KSU_DIR}" rev-list --count HEAD 2>/dev/null || echo 0)"

          BUILD_SUFFIX="${{ matrix.artifact_prefix }}-${KSU_TAG}-kprobes"

          echo "KSU tag     : ${KSU_TAG}"
          echo "KSU numeric : ${KSU_NUMERIC}"
          echo "Build suffix: ${BUILD_SUFFIX}"

          echo "KSUDIR=${KSU_DIR}"                                    >> $GITHUB_ENV
          echo "BUILDSUFFIX=${BUILD_SUFFIX}"                          >> $GITHUB_ENV
          echo "SUSFSSKIPKSUDRIVERPATCH=${{ matrix.skip_drv_patch }}" >> $GITHUB_ENV

      # ── Step 4: Apply SUSFS kernel patches ───────────────────────────────
      # Two patches live in the SUSFS repo:
      #   50addsusfsin<branch>.patch — hooks into kernel fs/ code (ALWAYS applied)
      #   10-enable_susfs_for_ksu.patch — hooks into KSU driver code
      #                                   (SKIPPED for all: built-in on each branch)
      - name: Apply SUSFS patches
        run: |
          echo "==> Cloning SUSFS (branch: ${{ env.SUSFS_BRANCH }})..."
          git clone --depth 1 \
            "${{ env.SUSFS_REPO }}" \
            -b "${{ env.SUSFS_BRANCH }}" \
            susfs4ksu \
          || { echo "ERROR: Failed to clone SUSFS from GitLab. Aborting."; exit 1; }

          # 4a: Copy SUSFS source files into kernel tree
          echo "Copying SUSFS source files..."
          cp susfs4ksu/kernel/patches/fs/susfs.c               fs/
          cp susfs4ksu/kernel/patches/include/linux/susfs.h     include/linux/
          cp susfs4ksu/kernel/patches/include/linux/susfs_def.h include/linux/

          # 4b: Apply main SUSFS kernel patch (wires fs/ hooks)
          echo "Applying 50addsusfsin${{ env.SUSFS_BRANCH }}.patch..."
          patch -p1 --forward \
            < "susfs4ksu/kernel/patches/50addsusfsin${{ env.SUSFS_BRANCH }}.patch" \
          || { echo "ERROR: Main SUSFS kernel patch failed — possible conflict with Samsung tree."; exit 1; }

          # 4c: KSU driver patch — intentionally skipped for all three variants
          if [ "${SUSFSSKIPKSUDRIVERPATCH}" = "true" ]; then
            echo "KSU driver patch skipped — ${{ matrix.display_name }} has SUSFS built-in."
          else
            echo "Applying 10-enable_susfs_for_ksu.patch..."
            patch -p1 --forward \
              < "susfs4ksu/kernel/patches/10-enable_susfs_for_ksu.patch" \
            || { echo "ERROR: KSU driver patch failed."; exit 1; }
          fi

          rm -rf susfs4ksu
          echo "==> SUSFS kernel patching complete."

      # ── Step 5: Resolve kernel version + build date ──────────────────────
      - name: Get kernel version and date
        id: meta
        run: |
          KVER=$(make kernelversion 2>/dev/null | awk -F. '{print $1"."$2"."$3}')
          echo "kernelversion=${KVER}" >> $GITHUB_OUTPUT
          echo "date=$(date +%Y%m%d)"  >> $GITHUB_OUTPUT
          echo "Kernel version: ${KVER}"

      # ── Step 6: Expand swap to 24 GB ─────────────────────────────────────
      - name: Set up swap (24 GB)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      # ── Step 7: Generate defconfig + compile kernel ───────────────────────
      - name: Build kernel (${{ matrix.display_name }})
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"

          echo "==> Generating defconfig gki_defconfig..."
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVMIAS=1 \
            gki_defconfig

          echo "==> Building kernel: ${{ matrix.display_name }} [${BUILDSUFFIX}]..."
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVMIAS=1

          echo "==> Build complete."

      # ── Step 8: Package with AnyKernel3 ──────────────────────────────────
      # AnyKernel3.zip is pre-configured in .github/goodies:
      #   device check disabled, slot=auto — works for all SM8550 variants.
      - name: Package AnyKernel3 ZIP
        run: |
          cp .github/goodies/AnyKernel3.zip .
          unzip AnyKernel3.zip -d AnyKernel3
          cp out/arch/arm64/boot/Image.gz AnyKernel3/

      # ── Step 9: Upload artifact ───────────────────────────────────────────
      # Artifact name: sm8550-<kernelver>-<variant>-<ksu-tag>-kprobes-susfs-<date>
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: >-
            sm8550-${{ steps.meta.outputs.kernelversion }}-${{ env.BUILDSUFFIX }}-susfs-${{ steps.meta.outputs.date }}
          path:              AnyKernel3
          compression-level: 9
          if-no-files-found: warn
          overwrite:         false
