# ============================================================================
# SM8550 Kernel Matrix Build — Selectable Variants + Clang Cache + KPM
#
# FIXES in this revision:
#
# FIX 6 — SukiSU Ultra kpm/compact.c: fatal error 'policy/allowlist.h'
#   compact.c uses #include "policy/allowlist.h" — relative to the kpm/
#   subdir, so the compiler looks for kpm/policy/allowlist.h which does
#   not exist. The real file is drivers/kernelsu/policy/allowlist.h.
#   Solution: after setup.sh runs, patch the REAL build location
#   drivers/kernelsu/kpm/Makefile (not the source repo).
#
# FIX 7 — SukiSU Ultra feature/kernel_umount.c: 'ksu_cred' undeclared
#   kernel_umount.c references ksu_cred but lost its #include "ksu.h"
#   during the v4.1.x refactor. Solution: add the missing include + the
#   same -I path to drivers/kernelsu/feature/Makefile.
#
# FIX 8 — ReSukiSU Ultra: KPM builds but shows "KPM unsupported" at runtime
#   CONFIG_KPM=y is set and kpm.o compiles, but the KSU manager reports
#   KPM unsupported. The runtime KPM init requires module_alloc() to be
#   reachable via kallsyms. CONFIG_MODULES=y makes the symbol appear.
#
# FIX 9 — SUSFS config verification shows empty for SukiSU Ultra
#   Two-pass scripts/config + olddefconfig guarantees symbols stick.
# ============================================================================

name: Build SM8550 Kernel — KSU Matrix

on:
  workflow_dispatch:
    inputs:
      build_ksun:
        description: "Build KernelSU-Next (stable)"
        type: boolean
        default: true
      build_sukisu:
        description: "Build SukiSU Ultra (main)"
        type: boolean
        default: true
      build_resukisu:
        description: "Build ReSukiSU (main)"
        type: boolean
        default: true
      enable_kpm:
        description: "Enable KPM — Kernel Patch Manager (SukiSU Ultra + ReSukiSU only)"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write
  packages: write

env:
  KERNEL_BRANCH: android13-5.15
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_BRANCH: gki-android13-5.15
  CLANG_VERSION: r584948
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:

# ── Job 1: Resolve build matrix ───────────────────────────────────────────
  setup:
    name: Resolve build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix:   ${{ steps.build-matrix.outputs.matrix }}
      is_empty: ${{ steps.build-matrix.outputs.is_empty }}

    steps:
      - name: Build variant matrix from inputs
        id: build-matrix
        run: |
          VARIANTS='[]'

          if [ "${{ inputs.build_ksun }}" = "true" ]; then
            VARIANTS=$(echo "$VARIANTS" | jq -c '. += [{
              "variant":        "ksun-stable",
              "display_name":   "KernelSU-Next (stable)",
              "setup_url":      "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/stable/kernel/setup.sh",
              "setup_arg":      "stable",
              "ksu_dir":        "KernelSU-Next",
              "artifact_prefix":"ksun-stable",
              "skip_drv_patch": "true",
              "enable_kpm":     "false"
            }]')
          fi

          if [ "${{ inputs.build_sukisu }}" = "true" ]; then
            VARIANTS=$(echo "$VARIANTS" | jq -c '. += [{
              "variant":        "sukisu-ultra",
              "display_name":   "SukiSU Ultra (main)",
              "setup_url":      "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh",
              "setup_arg":      "main",
              "ksu_dir":        "KernelSU",
              "artifact_prefix":"sukisu-susfs",
              "skip_drv_patch": "true",
              "enable_kpm":     "${{ inputs.enable_kpm }}"
            }]')
          fi

          if [ "${{ inputs.build_resukisu }}" = "true" ]; then
            VARIANTS=$(echo "$VARIANTS" | jq -c '. += [{
              "variant":        "resukisu",
              "display_name":   "ReSukiSU (main)",
              "setup_url":      "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh",
              "setup_arg":      "main",
              "ksu_dir":        "KernelSU",
              "artifact_prefix":"resukisu",
              "skip_drv_patch": "true",
              "enable_kpm":     "${{ inputs.enable_kpm }}"
            }]')
          fi

          COUNT=$(echo "$VARIANTS" | jq 'length')
          echo "Selected $COUNT variant(s)."

          if [ "$COUNT" -eq 0 ]; then
            echo "is_empty=true"  >> $GITHUB_OUTPUT
            echo 'matrix={"include":[]}' >> $GITHUB_OUTPUT
            echo "::warning::No variants selected — tick at least one checkbox."
          else
            echo "is_empty=false" >> $GITHUB_OUTPUT
            MATRIX=$(printf '{"include":%s}' "$VARIANTS" | jq -c .)
            echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          fi

# ── Job 2: Cache Clang ONCE ───────────────────────────────────────────────
  prepare-clang:
    name: Cache Clang toolchain
    runs-on: ubuntu-24.04

    steps:
      - name: Restore Clang from cache
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang-toolchain
          key:  clang-aosp-${{ env.CLANG_VERSION }}

      - name: Download Clang (cache miss only)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss — downloading AOSP Clang ${{ env.CLANG_VERSION }}..."
          curl -sSfL --retry 3 --connect-timeout 30 \
            -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/mirror-goog-main-llvm-toolchain-source/clang-${{ env.CLANG_VERSION }}.tar.gz" \
            || { echo "ERROR: Clang download failed."; exit 1; }
          mkdir -p clang-toolchain
          tar -xf clang.tar.gz -C clang-toolchain
          rm -f clang.tar.gz

      - name: Verify Clang
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          clang --version || { echo "ERROR: clang binary not found."; exit 1; }

# ── Job 3: Build ──────────────────────────────────────────────────────────
  build:
    name: ${{ matrix.display_name }}
    needs: [setup, prepare-clang]
    if: needs.setup.outputs.is_empty == 'false'
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:

      # ── 1. Checkout kernel source ────────────────────────────────────────
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ndutg/kernel_samsung_sm8550-common-ksususfs
          ref:        ${{ env.KERNEL_BRANCH }}
          fetch-depth: 1
          token:      ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Install build dependencies ───────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential curl flex \
            g++-multilib gcc-multilib git gnupg \
            lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libssl-dev \
            lzop zlib1g-dev pahole dwarves cpio zip \
            python3 python-is-python3 tar perl lz4 jq

      # ── 3. Restore Clang (restore-only) ─────────────────────────────────
      - name: Restore Clang ${{ env.CLANG_VERSION }} from cache
        uses: actions/cache/restore@v4
        with:
          path: clang-toolchain
          key:  clang-aosp-${{ env.CLANG_VERSION }}
          fail-on-cache-miss: true

      - name: Verify Clang
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          clang --version || { echo "ERROR: clang not found."; exit 1; }

      # ── 4. Setup KSU variant ─────────────────────────────────────────────
      - name: Setup ${{ matrix.display_name }}
        id: ksu
        run: |
          echo "==> Setting up ${{ matrix.display_name }}..."
          curl -sSfL --retry 3 --connect-timeout 20 \
            "${{ matrix.setup_url }}" \
            | bash -s "${{ matrix.setup_arg }}" \
            || { echo "ERROR: setup.sh failed."; exit 1; }

          KSU_DIR="${{ matrix.ksu_dir }}"

          KSU_TAG=$(git -C "${KSU_DIR}" describe --tags --abbrev=0 2>/dev/null \
            || git -C "${KSU_DIR}" tag --list 'v[0-9]*' --sort=-v:refname \
               2>/dev/null | head -1 \
            || echo "main")

          KPM_SUFFIX=""
          if [ "${{ matrix.enable_kpm }}" = "true" ]; then
            KPM_SUFFIX="-kpm"
          fi

          BUILD_SUFFIX="${{ matrix.artifact_prefix }}-${KSU_TAG}-kprobes${KPM_SUFFIX}"

          echo "KSU tag      : ${KSU_TAG}"
          echo "KPM enabled  : ${{ matrix.enable_kpm }}"
          echo "Build suffix : ${BUILD_SUFFIX}"

          echo "KSUDIR=${KSU_DIR}"                                    >> $GITHUB_ENV
          echo "BUILDSUFFIX=${BUILD_SUFFIX}"                          >> $GITHUB_ENV
          echo "SUSFSSKIPKSUDRIVERPATCH=${{ matrix.skip_drv_patch }}" >> $GITHUB_ENV

      # ── 5. Install KPM uapi headers + fix include paths (FIX 6 + FIX 7) ─
      #      FIXED: now patches the ACTUAL build location drivers/kernelsu/
      #      (setup.sh copies/integrates the KSU code into drivers/kernelsu/)
      - name: Install KPM uapi headers + patch include paths
        if: matrix.enable_kpm == 'true'
        run: |
          KSU_DIR="${{ matrix.ksu_dir }}"
          echo "==> Installing KPM uapi headers from ${KSU_DIR}/uapi/ ..."
          mkdir -p include/uapi

          if [ -d "${KSU_DIR}/uapi" ]; then
            echo "Found ${KSU_DIR}/uapi/ — copying all headers..."
            cp "${KSU_DIR}/uapi/"*.h include/uapi/
            echo "Installed headers:"
            ls include/uapi/*.h
          else
            echo "No uapi/ dir found — falling back to find-and-copy..."
            for HDR_NAME in supercall.h app_profile.h; do
              SRC=$(find "${KSU_DIR}" -name "${HDR_NAME}" 2>/dev/null | head -1)
              if [ -z "$SRC" ]; then
                echo "ERROR: ${HDR_NAME} not found under ${KSU_DIR}/"
                find "${KSU_DIR}" -maxdepth 6 -name "*.h" | head -30 || true
                exit 1
              fi
              cp "$SRC" "include/uapi/${HDR_NAME}"
              echo "${HDR_NAME} installed -> include/uapi/${HDR_NAME}"
            done
          fi

          for HDR in supercall.h app_profile.h; do
            test -f "include/uapi/${HDR}" \
              && echo "OK: include/uapi/${HDR}" \
              || { echo "ERROR: include/uapi/${HDR} missing after install"; exit 1; }
          done

          # ── FIX 6 + FIX 7: patch the REAL build location (drivers/kernelsu/) ──
          for DIR in kpm feature; do
            MK="drivers/kernelsu/${DIR}/Makefile"
            if [ -f "${MK}" ]; then
              if ! grep -q 'drivers/kernelsu' "${MK}"; then
                echo "" >> "${MK}"
                echo '# FIX 6/7: expose drivers/kernelsu/ so policy/allowlist.h and ksu.h resolve' >> "${MK}"
                echo 'ccflags-y += -I$(srctree)/drivers/kernelsu' >> "${MK}"
                echo "Patched ${MK} with -I$(srctree)/drivers/kernelsu"
              else
                echo "${MK} already contains the include path — skip."
              fi
            else
              echo "WARNING: ${MK} not found — KPM may not be present in this variant."
            fi
          done

          # ── FIX 7b: ensure ksu.h is included in kernel_umount.c ─────────────
          UMOUNT_C="drivers/kernelsu/feature/kernel_umount.c"
          if [ -f "${UMOUNT_C}" ]; then
            if ! grep -q '#include "ksu.h"' "${UMOUNT_C}"; then
              # Prepend after the last existing #include line (more reliable sed)
              if ! sed -i '0,/#include/{//a #include "ksu.h"  /* FIX 7b: ksu_cred declaration */}' "${UMOUNT_C}" 2>/dev/null; then
                echo "WARNING: primary sed failed, using fallback prepend"
                sed -i '1s/^/#include "ksu.h"  \/* FIX 7b *\/\n/' "${UMOUNT_C}"
              fi
              echo "Patched ${UMOUNT_C} — added #include \"ksu.h\""
              head -8 "${UMOUNT_C}"
            else
              echo "kernel_umount.c already includes ksu.h — skip."
            fi
          else
            echo "WARNING: ${UMOUNT_C} not found."
          fi

      # ── 6. Apply SUSFS patches ───────────────────────────────────────────
      - name: Apply SUSFS patches
        run: |
          git clone --depth 1 \
            "${{ env.SUSFS_REPO }}" \
            -b "${{ env.SUSFS_BRANCH }}" \
            susfs4ksu \
            || { echo "ERROR: SUSFS clone failed."; exit 1; }

          cp susfs4ksu/kernel_patches/fs/susfs.c                       fs/
          cp susfs4ksu/kernel_patches/include/linux/susfs.h            include/linux/
          cp susfs4ksu/kernel_patches/include/linux/susfs_def.h        include/linux/

          patch -p1 --forward \
            < "susfs4ksu/kernel_patches/50_add_susfs_in_${{ env.SUSFS_BRANCH }}.patch" \
            || { echo "ERROR: SUSFS kernel patch failed."; exit 1; }

          if [ "${SUSFSSKIPKSUDRIVERPATCH}" = "true" ]; then
            echo "KSU driver patch skipped — built-in on this branch."
          else
            patch -p1 --forward \
              < "susfs4ksu/kernel_patches/10_enable_susfs_for_ksu.patch" \
              || { echo "ERROR: KSU driver patch failed."; exit 1; }
          fi

          rm -rf susfs4ksu
          echo "==> SUSFS patching complete."

      # ── 7. Kernel version + date ─────────────────────────────────────────
      - name: Resolve kernel version and date
        id: meta
        run: |
          KVER=$(make kernelversion 2>/dev/null | awk -F. '{print $1"."$2"."$3}')
          echo "kernelversion=${KVER}" >> $GITHUB_OUTPUT
          echo "date=$(date +%Y%m%d)"  >> $GITHUB_OUTPUT

      # ── 8. Swap (24 GB) ──────────────────────────────────────────────────
      - name: Set up swap (24 GB)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      # ── 9. Generate defconfig ────────────────────────────────────────────
      - name: Generate defconfig
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            gki_defconfig

      # ── 10. Enable SUSFS + KPM kernel configs (TWO-PASS) ────────────────
      - name: Enable SUSFS + KPM kernel configs
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"

          apply_configs() {
            echo "==> Enabling SUSFS configs..."
            ./scripts/config --file out/.config \
              -e CONFIG_KSU_SUSFS \
              -e CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT \
              -e CONFIG_KSU_SUSFS_SUS_PATH \
              -e CONFIG_KSU_SUSFS_SUS_MOUNT \
              -e CONFIG_KSU_SUSFS_SUS_KSTAT \
              -e CONFIG_KSU_SUSFS_SUS_OVERLAYFS \
              -e CONFIG_KSU_SUSFS_TRY_UMOUNT \
              -e CONFIG_KSU_SUSFS_SPOOF_UNAME \
              -e CONFIG_KSU_SUSFS_ENABLE_LOG \
              -e CONFIG_KSU_SUSFS_OPEN_REDIRECT \
              -e CONFIG_KSU_SUSFS_SUS_SU

            if [ "${{ matrix.enable_kpm }}" = "true" ]; then
              echo "==> Enabling KPM configs (${{ matrix.display_name }})..."
              ./scripts/config --file out/.config \
                -e CONFIG_KPM \
                -e CONFIG_KALLSYMS \
                -e CONFIG_KALLSYMS_ALL \
                -e CONFIG_MODULES
            fi
          }

          # Pass 1
          apply_configs
          echo "==> Pass 1: olddefconfig..."
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            olddefconfig

          # Pass 2 — re-apply after dep resolution (FIX 9)
          apply_configs
          echo "==> Pass 2: olddefconfig..."
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            olddefconfig

          echo "==> Config verification:"
          echo "--- SUSFS ---"
          grep "CONFIG_KSU_SUSFS" out/.config | sort
          echo "--- KPM ---"
          grep -E "CONFIG_KPM|CONFIG_KALLSYMS|CONFIG_MODULES" out/.config | sort

      # ── 11. Compile kernel ───────────────────────────────────────────────
      - name: Build kernel (${{ matrix.display_name }})
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          echo "==> Compiling: ${{ matrix.display_name }} [${BUILDSUFFIX}]..."
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1

      # ── 12. Package with AnyKernel3 ─────────────────────────────────────
      - name: Package AnyKernel3 ZIP
        run: |
          cp .github/goodies/AnyKernel3.zip .
          unzip AnyKernel3.zip -d AnyKernel3

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/
          else
            echo "ERROR: No kernel Image found in out/arch/arm64/boot/"
            ls out/arch/arm64/boot/ || true
            exit 1
          fi

      # ── 13. Upload artifact ──────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: >-
            sm8550-${{ steps.meta.outputs.kernelversion }}-${{ env.BUILDSUFFIX }}-susfs-${{ steps.meta.outputs.date }}
          path: AnyKernel3
          compression-level: 9
          if-no-files-found: warn
          overwrite: false
