# ============================================================================
# SM8550 Kernel Matrix Build — Selectable Variants + Clang Cache + KPM
# ============================================================================

name: Build SM8550 Kernel — KSU Matrix

on:
  workflow_dispatch:
    inputs:
      build_ksun:
        description: "Build KernelSU-Next (stable)"
        type: boolean
        default: true
      build_sukisu:
        description: "Build SukiSU Ultra (main)"
        type: boolean
        default: true
      build_resukisu:
        description: "Build ReSukiSU (main)"
        type: boolean
        default: true
      enable_kpm:
        description: "Enable KPM — Kernel Patch Manager (SukiSU Ultra + ReSukiSU only)"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write
  packages: write

env:
  KERNEL_BRANCH: android13-5.15
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_BRANCH: gki-android13-5.15
  CLANG_VERSION: r584948
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── Job 1: Setup Matrix ──────────────────────────────────────────────────
  setup:
    name: Prepare Matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      is_empty: ${{ steps.set-matrix.outputs.is_empty }}
    steps:
      - name: Generate matrix JSON
        id: set-matrix
        run: |
          MATRIX_JSON="{\"include\":["
          HAS_JOBS="false"

          if [ "${{ github.event.inputs.build_ksun }}" = "true" ]; then
            MATRIX_JSON="${MATRIX_JSON}{\"display_name\":\"KernelSU-Next\",\"artifact_prefix\":\"KSUN\",\"ksu_dir\":\"KernelSU-Next\",\"setup_url\":\"https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh\",\"setup_arg\":\"next\",\"skip_drv_patch\":\"false\",\"enable_kpm\":\"false\"},"
            HAS_JOBS="true"
          fi

          if [ "${{ github.event.inputs.build_sukisu }}" = "true" ]; then
            MATRIX_JSON="${MATRIX_JSON}{\"display_name\":\"SukiSU Ultra\",\"artifact_prefix\":\"SukiSU\",\"ksu_dir\":\"KernelSU\",\"setup_url\":\"https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh\",\"setup_arg\":\"main\",\"skip_drv_patch\":\"true\",\"enable_kpm\":\"${{ github.event.inputs.enable_kpm }}\"},"
            HAS_JOBS="true"
          fi

          if [ "${{ github.event.inputs.build_resukisu }}" = "true" ]; then
            MATRIX_JSON="${MATRIX_JSON}{\"display_name\":\"ReSukiSU\",\"artifact_prefix\":\"ReSukiSU\",\"ksu_dir\":\"KernelSU\",\"setup_url\":\"https://raw.githubusercontent.com/backslashxx/KernelSU/main/kernel/setup.sh\",\"setup_arg\":\"main\",\"skip_drv_patch\":\"true\",\"enable_kpm\":\"${{ github.event.inputs.enable_kpm }}\"},"
            HAS_JOBS="true"
          fi

          if [ "$HAS_JOBS" = "true" ]; then
            MATRIX_JSON="${MATRIX_JSON%,}]}"
            echo "is_empty=false" >> $GITHUB_OUTPUT
          else
            MATRIX_JSON="{\"include\":[]}"
            echo "is_empty=true" >> $GITHUB_OUTPUT
          fi

          echo "matrix=${MATRIX_JSON}" >> $GITHUB_OUTPUT

  # ── Job 2: Cache Clang ONCE ───────────────────────────────────────────────
  prepare-clang:
    name: Cache Clang toolchain
    runs-on: ubuntu-24.04
    steps:
      - name: Restore Clang from cache
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang-toolchain
          key:  clang-aosp-${{ env.CLANG_VERSION }}

      - name: Download Clang (cache miss only)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          curl -sSfL --retry 3 -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/mirror-goog-main-llvm-toolchain-source/clang-${{ env.CLANG_VERSION }}.tar.gz"
          mkdir -p clang-toolchain
          tar -xf clang.tar.gz -C clang-toolchain
          rm -f clang.tar.gz

  # ── Job 3: Build ──────────────────────────────────────────────────────────
  build:
    name: ${{ matrix.display_name }}
    needs: [setup, prepare-clang]
    if: needs.setup.outputs.is_empty == 'false'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ndutg/kernel_samsung_sm8550-common-ksususfs
          ref: ${{ env.KERNEL_BRANCH }}
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg libelf-dev libssl-dev lzop pahole dwarves cpio zip python3 tar perl lz4 jq

      - name: Restore Clang from cache
        uses: actions/cache/restore@v4
        with:
          path: clang-toolchain
          key:  clang-aosp-${{ env.CLANG_VERSION }}
          fail-on-cache-miss: true

      - name: Setup ${{ matrix.display_name }}
        run: |
          curl -sSfL "${{ matrix.setup_url }}" | bash -s "${{ matrix.setup_arg }}"
          
          KSU_TAG=$(git -C "${{ matrix.ksu_dir }}" describe --tags --abbrev=0 2>/dev/null || echo "main")
          KPM_SUFFIX=$([ "${{ matrix.enable_kpm }}" = "true" ] && echo "-kpm" || echo "")
          
          echo "BUILDSUFFIX=${{ matrix.artifact_prefix }}-${KSU_TAG}-kprobes${KPM_SUFFIX}" >> $GITHUB_ENV
          echo "KSUDIR=${{ matrix.ksu_dir }}" >> $GITHUB_ENV
          echo "SUSFSSKIPKSUDRIVERPATCH=${{ matrix.skip_drv_patch }}" >> $GITHUB_ENV

      - name: Patch KSU & SUSFS dependencies
        run: |
          KSU_DIR="${{ env.KSUDIR }}"
          
          if [ "${{ matrix.enable_kpm }}" = "true" ]; then
            echo "==> Fixing KPM Header paths..."
            # 1. Patch Makefiles to include the uapi directory where supercall.h lives
            for MKFILE in "drivers/kernelsu/kpm/Makefile" "drivers/kernelsu/feature/Makefile"; do
              if [ -f "$MKFILE" ]; then
                echo "ccflags-y += -I\$(srctree)/drivers/kernelsu" >> "$MKFILE"
                echo "ccflags-y += -I\$(srctree)/drivers/kernelsu/uapi" >> "$MKFILE"
                echo "Patched $MKFILE"
              fi
            done

            # 2. Copy headers to include/uapi as a fallback for global headers
            mkdir -p include/uapi
            cp ${KSU_DIR}/uapi/*.h include/uapi/ 2>/dev/null || true
          fi

          # 3. Apply ksu_cred extern fix (fixes 'ksu_cred' undeclared errors)
          echo "Applying ksu_cred fix..."
          find "$KSU_DIR" -name "*.c" | xargs grep -l "ksu_cred" | while read -r file; do
            if ! grep -q "extern const struct cred \*ksu_cred" "$file"; then
              sed -i '1i #include <linux/cred.h>\nextern const struct cred *ksu_cred;' "$file"
              echo "Patched $file"
            fi
          done

      - name: Apply SUSFS patches
        run: |
          git clone --depth 1 "${{ env.SUSFS_REPO }}" -b "${{ env.SUSFS_BRANCH }}" susfs4ksu
          cp susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          cp susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/
          patch -p1 < "susfs4ksu/kernel_patches/50_add_susfs_in_${{ env.SUSFS_BRANCH }}.patch"
          
          if [ "${{ env.SUSFSSKIPKSUDRIVERPATCH }}" != "true" ]; then
            patch -p1 < "susfs4ksu/kernel_patches/10_enable_susfs_for_ksu.patch"
          fi
          rm -rf susfs4ksu

      - name: Set up swap (24 GB)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Build kernel
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 gki_defconfig
          
          # Enable Configs
          ./scripts/config --file out/.config -e CONFIG_KSU_SUSFS -e CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT -e CONFIG_KSU_SUSFS_SUS_PATH -e CONFIG_KSU_SUSFS_SUS_MOUNT -e CONFIG_KSU_SUSFS_SUS_KSTAT -e CONFIG_KSU_SUSFS_SUS_OVERLAYFS -e CONFIG_KSU_SUSFS_TRY_UMOUNT -e CONFIG_KSU_SUSFS_SPOOF_UNAME -e CONFIG_KSU_SUSFS_ENABLE_LOG -e CONFIG_KSU_SUSFS_OPEN_REDIRECT -e CONFIG_KSU_SUSFS_SUS_SU
          
          if [ "${{ matrix.enable_kpm }}" = "true" ]; then
            ./scripts/config --file out/.config -e CONFIG_KPM -e CONFIG_KALLSYMS -e CONFIG_KALLSYMS_ALL -e CONFIG_MODULES -e CONFIG_KPROBES -e CONFIG_HAVE_KPROBES -e CONFIG_KPROBE_EVENTS -e CONFIG_FTRACE
          fi

          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 olddefconfig
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1

      - name: Package AnyKernel3
        run: |
          KVER=$(make kernelversion 2>/dev/null | awk -F. '{print $1"."$2"."$3}')
          echo "KVER=$KVER" >> $GITHUB_ENV
          cp .github/goodies/AnyKernel3.zip .
          unzip AnyKernel3.zip -d AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/ 2>/dev/null || cp out/arch/arm64/boot/Image.gz AnyKernel3/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm8550-${{ env.KVER }}-${{ env.BUILDSUFFIX }}-${{ github.run_id }}
          path: AnyKernel3
