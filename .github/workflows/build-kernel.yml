# ============================================================================
# SM8550 Kernel Matrix Build — Selectable Variants + Clang Cache + KPM
# ============================================================================

name: Build SM8550 Kernel — KSU Matrix

on:
  workflow_dispatch:
    inputs:
      build_ksun:
        description: "Build KernelSU-Next (stable)"
        type: boolean
        default: true
      build_sukisu:
        description: "Build SukiSU Ultra (main)"
        type: boolean
        default: true
      build_resukisu:
        description: "Build ReSukiSU (main)"
        type: boolean
        default: true
      enable_kpm:
        description: "Enable KPM — Kernel Patch Manager"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write
  packages: write

env:
  KERNEL_BRANCH: android13-5.15
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_BRANCH: gki-android13-5.15
  CLANG_VERSION: r584948
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  setup:
    name: Resolve build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      is_empty: ${{ steps.build-matrix.outputs.is_empty }}
    steps:
      - name: Build variant matrix from inputs
        id: build-matrix
        run: |
          MATRIX_JSON='{"include":['
          FIRST=true
          add_entry() {
            if [ "$FIRST" = false ]; then MATRIX_JSON+=","; fi
            MATRIX_JSON+="{\"variant\":\"$1\",\"display_name\":\"$2\",\"ksu_url\":\"$3\",\"ksu_branch\":\"$4\"}"
            FIRST=false
          }
          if [ "${{ github.event.inputs.build_ksun }}" == "true" ]; then
            add_entry "ksun" "KernelSU-Next" "https://github.com/rifsxd/KernelSU-Next.git" "v3.2.0"
          fi
          if [ "${{ github.event.inputs.build_sukisu }}" == "true" ]; then
            add_entry "sukisu" "SukiSU Ultra" "https://github.com/backslashxx/KernelSU" "main"
          fi
          if [ "${{ github.event.inputs.build_resukisu }}" == "true" ]; then
            add_entry "resukisu" "ReSukiSU" "https://github.com/TheWildJames/KernelSU" "main"
          fi
          MATRIX_JSON+=']}'
          if [ "$FIRST" = true ]; then
            echo "is_empty=true" >> $GITHUB_OUTPUT
            echo "matrix={}" >> $GITHUB_OUTPUT
          else
            echo "is_empty=false" >> $GITHUB_OUTPUT
            echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT
          fi

  build:
    needs: setup
    if: needs.setup.outputs.is_empty == 'false'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ndutg/kernel_samsung_sm8550-common-ksususfs
          ref: main
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lzip zip unzip gperf \
            libncurses5-dev libssl-dev libelf-dev pahole

      - name: Restore Clang cache
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang-toolchain
          key: clang-${{ env.CLANG_VERSION }}

      - name: Download Clang if not cached
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang-toolchain
          CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-${{ env.CLANG_VERSION }}.tar.gz"
          curl -Lo clang.tar.gz "$CLANG_URL"
          tar -C clang-toolchain -xzf clang.tar.gz
          rm clang.tar.gz

      - name: Setup KernelSU Variant
        run: |
          git clone --recursive ${{ matrix.ksu_url }} -b ${{ matrix.ksu_branch }} drivers/kernelsu

      - name: Setup SUSFS
        run: |
          git clone ${{ env.SUSFS_REPO }} -b ${{ env.SUSFS_BRANCH }} susfs4ksu
          cp susfs4ksu/kernel_patches/fs/* fs/
          cp susfs4ksu/kernel_patches/include/linux/* include/linux/
          # Apply only non-conflicting SUSFS driver components
          cp susfs4ksu/kernel_patches/drivers/kernelsu/ksu_susfs.c drivers/kernelsu/
          cp susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/

      - name: Configure kernel
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          make O=out ARCH=arm64 vendor/kalama_qgki_defconfig

      - name: Enable SUSFS + KPM + BTF Fix
        run: |
          # Disable BTF to avoid pahole errors
          ./scripts/config --file out/.config -d CONFIG_DEBUG_INFO_BTF
          
          # Enable SUSFS Features
          ./scripts/config --file out/.config \
            -e CONFIG_KSU_SUSFS \
            -e CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT \
            -e CONFIG_KSU_SUSFS_SUS_PATH \
            -e CONFIG_KSU_SUSFS_SUS_MOUNT \
            -e CONFIG_KSU_SUSFS_SUS_KSTAT \
            -e CONFIG_KSU_SUSFS_SUS_OVERLAYFS \
            -e CONFIG_KSU_SUSFS_TRY_UMOUNT \
            -e CONFIG_KSU_SUSFS_SPOOF_UNAME \
            -e CONFIG_KSU_SUSFS_ENABLE_LOG \
            -e CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            -e CONFIG_KSU_SUSFS_SUS_SU

          # Enable KPM if selected
          if [ "${{ github.event.inputs.enable_kpm }}" == "true" ]; then
            ./scripts/config --file out/.config -e CONFIG_KPM -e CONFIG_KALLSYMS_ALL
          fi
          
          make O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 olddefconfig

      - name: Patch Header Refactors & Legacy Stubs
        run: |
          echo "==> Patching headers..."
          sed -i '/#include <linux\/cred.h>/a \
          extern struct cred *ksu_cred;\
          extern bool allow_shell;\
          extern bool ksu_late_loaded;' include/linux/cred.h

          sed -i '/#include <linux\/types.h>/a \
          extern bool ksu_late_loaded;' include/linux/sched.h

          echo "==> Generating legacy stubs for deprecated symbols..."
          cat << 'EOF' > drivers/kernelsu/legacy_stubs.c
          #include <linux/types.h>
          bool ksu_handle_sys_reboot(void) { return false; }
          void ksu_init_rc_hook(void) {}
          bool ksu_handle_sys_read(void) { return false; }
          bool ksu_handle_vfs_fstat(void) { return false; }
          bool ksu_execveat_hook(void) { return false; }
          bool ksu_handle_execveat_sucompat(void) { return false; }
          bool ksu_handle_execveat(void) { return false; }
          bool ksu_handle_devpts(void) { return false; }
          bool ksu_input_hook(void) { return false; }
          bool susfs_is_current_ksu_domain(void) { return false; }
          u32 susfs_ksu_sid(void) { return 0; }
          u32 susfs_priv_app_sid(void) { return 0; }
          EOF
          
          # Add the stub file to the KernelSU build process
          echo "obj-y += legacy_stubs.o" >> drivers/kernelsu/Makefile

      - name: Build kernel (${{ matrix.display_name }})
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1

      - name: Package AnyKernel3 ZIP
        run: |
          cp .github/goodies/AnyKernel3.zip .
          unzip AnyKernel3.zip -d AnyKernel3
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/
          else
            echo "ERROR: No kernel Image found."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm8550-${{ matrix.variant }}-kernel
          path: AnyKernel3/*
