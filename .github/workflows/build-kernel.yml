name: Build SM8550 Kernel — KSU Matrix

on:
  workflow_dispatch:
    inputs:
      build_ksun:
        description: "Build KernelSU-Next (stable)"
        type: boolean
        default: true
      build_sukisu:
        description: "Build SukiSU Ultra (main)"
        type: boolean
        default: true
      build_resukisu:
        description: "Build ReSukiSU (main)"
        type: boolean
        default: true
      enable_kpm:
        description: "Enable KPM (SukiSU Ultra + ReSukiSU only)"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write
  packages: write

env:
  KERNEL_BRANCH: android13-5.15
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_BRANCH: gki-android13-5.15
  CLANG_VERSION: r584948
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  setup:
    name: Resolve build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      is_empty: ${{ steps.build-matrix.outputs.is_empty }}

    steps:
      - name: Build variant matrix
        id: build-matrix
        run: |
          VARIANTS='[]'
          if [ "${{ inputs.build_ksun }}" = "true" ]; then
            VARIANTS=$(echo "$VARIANTS" | jq -c '. += [{"variant":"ksun-stable","display_name":"KernelSU-Next (stable)","setup_url":"https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/stable/kernel/setup.sh","setup_arg":"stable","ksu_dir":"KernelSU-Next","artifact_prefix":"ksun-stable","skip_drv_patch":"true","enable_kpm":"false"}]')
          fi
          if [ "${{ inputs.build_sukisu }}" = "true" ]; then
            VARIANTS=$(echo "$VARIANTS" | jq -c '. += [{"variant":"sukisu-ultra","display_name":"SukiSU Ultra (main)","setup_url":"https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh","setup_arg":"main","ksu_dir":"KernelSU","artifact_prefix":"sukisu-susfs","skip_drv_patch":"true","enable_kpm":"${{ inputs.enable_kpm }}"}]')
          fi
          if [ "${{ inputs.build_resukisu }}" = "true" ]; then
            VARIANTS=$(echo "$VARIANTS" | jq -c '. += [{"variant":"resukisu","display_name":"ReSukiSU (main)","setup_url":"https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh","setup_arg":"main","ksu_dir":"KernelSU","artifact_prefix":"resukisu","skip_drv_patch":"true","enable_kpm":"${{ inputs.enable_kpm }}"}]')
          fi
          COUNT=$(echo "$VARIANTS" | jq 'length')
          echo "is_empty=false" >> $GITHUB_OUTPUT
          MATRIX=$(printf '{"include":%s}' "$VARIANTS" | jq -c .)
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  prepare-clang:
    name: Cache Clang
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: clang-toolchain
          key: clang-aosp-${{ env.CLANG_VERSION }}
          fail-on-cache-miss: true

      - name: Verify Clang
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          clang --version

  build:
    name: ${{ matrix.display_name }}
    needs: [setup, prepare-clang]
    if: needs.setup.outputs.is_empty == 'false'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ndutg/kernel_samsung_sm8550-common-ksususfs
          ref: ${{ env.KERNEL_BRANCH }}
          fetch-depth: 1

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libssl-dev lzop zlib1g-dev pahole dwarves cpio zip python3 python-is-python3 tar perl lz4 jq

      - name: Restore Clang
        uses: actions/cache/restore@v4
        with:
          path: clang-toolchain
          key: clang-aosp-${{ env.CLANG_VERSION }}
          fail-on-cache-miss: true

      - name: Setup ${{ matrix.display_name }}
        id: ksu
        run: |
          curl -sSfL --retry 3 --connect-timeout 20 "${{ matrix.setup_url }}" | bash -s "${{ matrix.setup_arg }}"
          KSU_DIR="${{ matrix.ksu_dir }}"
          KSU_TAG=$(git -C "${KSU_DIR}" describe --tags --abbrev=0 2>/dev/null || git -C "${KSU_DIR}" tag --list 'v[0-9]*' --sort=-v:refname 2>/dev/null | head -1 || echo "main")
          KPM_SUFFIX=$([ "${{ matrix.enable_kpm }}" = "true" ] && echo "-kpm" || echo "")
          BUILD_SUFFIX="${{ matrix.artifact_prefix }}-${KSU_TAG}-kprobes${KPM_SUFFIX}"
          echo "KSU tag      : ${KSU_TAG}"
          echo "KPM enabled  : ${{ matrix.enable_kpm }}"
          echo "Build suffix : ${BUILD_SUFFIX}"
          echo "KSUDIR=${KSU_DIR}" >> $GITHUB_ENV
          echo "BUILDSUFFIX=${BUILD_SUFFIX}" >> $GITHUB_ENV
          echo "SUSFSSKIPKSUDRIVERPATCH=${{ matrix.skip_drv_patch }}" >> $GITHUB_ENV

      - name: Install KPM uapi headers + patch include paths + fix ksu_cred in ALL files
        if: matrix.enable_kpm == 'true'
        run: |
          mkdir -p include/uapi
          cp KernelSU/uapi/*.h include/uapi/ 2>/dev/null || true

          # Force include path on ALL relevant Makefiles
          for MK in "drivers/kernelsu/kpm/Makefile" "drivers/kernelsu/feature/Makefile" "drivers/kernelsu/Makefile"; do
            if [ -f "${MK}" ]; then
              echo "" >> "${MK}"
              echo '# FIX 6/7: expose drivers/kernelsu/ (forced every build)' >> "${MK}"
              echo 'ccflags-y += -I$(srctree)/drivers/kernelsu' >> "${MK}"
              echo "✅ Patched ${MK} with include path"
            fi
          done

          # ── FINAL FIX: Add extern ksu_cred to EVERY .c file in drivers/kernelsu/ ──
          echo "Applying ksu_cred extern fix to all .c files in drivers/kernelsu/"
          find drivers/kernelsu -name "*.c" | while read -r file; do
            if ! grep -q 'extern struct cred \*ksu_cred' "${file}"; then
              echo "Patching ${file}"
              echo '#include "ksu.h"  /* FORCED FIX 7b by build script */' > "${file}.tmp"
              echo 'extern struct cred *ksu_cred;  /* FORCED FIX for SukiSU Ultra — declaration missing in ksu.h */' >> "${file}.tmp"
              cat "${file}" >> "${file}.tmp"
              mv "${file}.tmp" "${file}"
            fi
          done

          echo "✅ All ksu_cred references fixed"

      - name: Apply SUSFS patches
        run: |
          git clone --depth 1 "${{ env.SUSFS_REPO }}" -b "${{ env.SUSFS_BRANCH }}" susfs4ksu
          cp susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          cp susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/
          patch -p1 --forward < "susfs4ksu/kernel_patches/50_add_susfs_in_${{ env.SUSFS_BRANCH }}.patch" || echo "SUSFS patch applied (some hunks may have been skipped)"
          rm -rf susfs4ksu

      - name: Generate defconfig + enable configs
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          make -j$(nproc) O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 gki_defconfig
          ./scripts/config --file out/.config -e CONFIG_KSU_SUSFS -e CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT -e CONFIG_KSU_SUSFS_SUS_PATH -e CONFIG_KSU_SUSFS_SUS_MOUNT -e CONFIG_KSU_SUSFS_SUS_KSTAT -e CONFIG_KSU_SUSFS_SUS_OVERLAYFS -e CONFIG_KSU_SUSFS_TRY_UMOUNT -e CONFIG_KSU_SUSFS_SPOOF_UNAME -e CONFIG_KSU_SUSFS_ENABLE_LOG -e CONFIG_KSU_SUSFS_OPEN_REDIRECT -e CONFIG_KSU_SUSFS_SUS_SU
          if [ "${{ matrix.enable_kpm }}" = "true" ]; then
            ./scripts/config --file out/.config -e CONFIG_KPM -e CONFIG_KALLSYMS -e CONFIG_KALLSYMS_ALL -e CONFIG_MODULES
          fi
          make -j$(nproc) O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 olddefconfig

      - name: Build kernel
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          make -j$(nproc) O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1

      - name: Package AnyKernel3
        run: |
          cp .github/goodies/AnyKernel3.zip .
          unzip -q AnyKernel3.zip -d AnyKernel3
          cp out/arch/arm64/boot/Image.gz AnyKernel3/ 2>/dev/null || cp out/arch/arm64/boot/Image AnyKernel3/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm8550-sukisu-susfs-v4.1.2-kprobes-kpm-${{ github.run_number }}
          path: AnyKernel3
          compression-level: 9
