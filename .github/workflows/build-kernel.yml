# ============================================================================
# SM8550 Kernel Matrix Build — Selectable Variants + Clang Cache + KPM
# FIXED: SUSFS Kconfig integration + config verification + KPM validation
# ============================================================================

name: Build SM8550 Kernel — KSU Matrix

on:
  workflow_dispatch:
    inputs:
      build_ksun:
        description: "Build KernelSU-Next (stable)"
        type: boolean
        default: true
      build_sukisu:
        description: "Build SukiSU Ultra (main)"
        type: boolean
        default: true
      build_resukisu:
        description: "Build ReSukiSU (main)"
        type: boolean
        default: true
      enable_kpm:
        description: "Enable KPM — Kernel Patch Manager"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write
  packages: write

env:
  KERNEL_BRANCH: android13-5.15
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_BRANCH: gki-android13-5.15
  CLANG_VERSION: r584948
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:

  # ── Job 1: Resolve build matrix ──────────────────────────────────────────
  setup:
    name: Resolve build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      is_empty: ${{ steps.build-matrix.outputs.is_empty }}

    steps:
      - name: Build variant matrix from inputs
        id: build-matrix
        run: |
          VARIANTS='[]'
          if [ "${{ inputs.build_ksun }}" = "true" ]; then
            VARIANTS=$(echo "$VARIANTS" | jq -c '. += [{
              "variant": "ksun-stable",
              "display_name": "KernelSU-Next (stable)",
              "setup_url": "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh",
              "setup_arg": "next",
              "ksu_dir": "KernelSU-Next",
              "artifact_prefix": "ksun-stable",
              "enable_kpm": "false"
            }]')
          fi
          if [ "${{ inputs.build_sukisu }}" = "true" ]; then
            VARIANTS=$(echo "$VARIANTS" | jq -c '. += [{
              "variant": "sukisu-ultra",
              "display_name": "SukiSU Ultra (main)",
              "setup_url": "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh",
              "setup_arg": "main",
              "ksu_dir": "KernelSU",
              "artifact_prefix": "sukisu-susfs",
              "enable_kpm": "${{ inputs.enable_kpm }}"
            }]')
          fi
          if [ "${{ inputs.build_resukisu }}" = "true" ]; then
            VARIANTS=$(echo "$VARIANTS" | jq -c '. += [{
              "variant": "resukisu",
              "display_name": "ReSukiSU (main)",
              "setup_url": "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh",
              "setup_arg": "main",
              "ksu_dir": "KernelSU",
              "artifact_prefix": "resukisu",
              "enable_kpm": "${{ inputs.enable_kpm }}"
            }]')
          fi
          COUNT=$(echo "$VARIANTS" | jq 'length')
          echo "Selected $COUNT variant(s)."
          if [ "$COUNT" -eq 0 ]; then
            echo "is_empty=true" >> $GITHUB_OUTPUT
            echo 'matrix={"include":[]}' >> $GITHUB_OUTPUT
            echo "::warning::No variants selected — tick at least one checkbox."
          else
            echo "is_empty=false" >> $GITHUB_OUTPUT
            MATRIX=$(printf '{"include":%s}' "$VARIANTS" | jq -c .)
            echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          fi

  # ── Job 2: Cache Clang toolchain ─────────────────────────────────────────
  prepare-clang:
    name: Cache Clang toolchain
    runs-on: ubuntu-24.04

    steps:
      - name: Restore Clang from cache
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang-toolchain
          key: clang-aosp-${{ env.CLANG_VERSION }}

      - name: Download Clang (cache miss only)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss — downloading AOSP Clang ${{ env.CLANG_VERSION }}..."
          curl -sSfL --retry 3 --connect-timeout 30 \
            -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/mirror-goog-main-llvm-toolchain-source/clang-${{ env.CLANG_VERSION }}.tar.gz" \
            || { echo "ERROR: Clang download failed."; exit 1; }
          mkdir -p clang-toolchain
          tar -xf clang.tar.gz -C clang-toolchain
          rm -f clang.tar.gz
          echo "Clang cached successfully."

      - name: Verify Clang
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          clang --version || { echo "ERROR: clang binary not found."; exit 1; }

  # ── Job 3: Build kernel ──────────────────────────────────────────────────
  build:
    name: ${{ matrix.display_name }}
    needs: [setup, prepare-clang]
    if: needs.setup.outputs.is_empty == 'false'
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:

      # ── 1. Checkout kernel source ──────────────────────────────────────────
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ndutg/kernel_samsung_sm8550-common-ksususfs
          ref: ${{ env.KERNEL_BRANCH }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Install build dependencies ──────────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential curl flex \
            g++-multilib gcc-multilib git gnupg \
            lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libssl-dev \
            lzop zlib1g-dev pahole dwarves cpio zip \
            python3 python-is-python3 tar perl lz4 jq

      # ── 3. Restore Clang cache ────────────────────────────────────────────
      - name: Restore Clang ${{ env.CLANG_VERSION }} from cache
        uses: actions/cache/restore@v4
        with:
          path: clang-toolchain
          key: clang-aosp-${{ env.CLANG_VERSION }}
          fail-on-cache-miss: true

      # ── 4. Verify Clang ───────────────────────────────────────────────────
      - name: Verify Clang
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          clang --version || { echo "ERROR: clang not found."; exit 1; }

      # ── 5. Setup KSU variant ──────────────────────────────────────────────
      - name: Setup ${{ matrix.display_name }}
        id: ksu
        run: |
          echo "==> Setting up ${{ matrix.display_name }}..."
          curl -sSfL --retry 3 --connect-timeout 20 \
            "${{ matrix.setup_url }}" \
            | bash -s "${{ matrix.setup_arg }}" \
            || { echo "ERROR: setup.sh failed."; exit 1; }

          KSU_DIR="${{ matrix.ksu_dir }}"
          KSU_TAG=$(git -C "${KSU_DIR}" describe --tags --abbrev=0 2>/dev/null \
            || git -C "${KSU_DIR}" tag --list 'v[0-9]*' --sort=-v:refname \
               2>/dev/null | head -1 \
            || echo "main")

          KPM_SUFFIX=""
          if [ "${{ matrix.enable_kpm }}" = "true" ]; then
            KPM_SUFFIX="-kpm"
          fi

          BUILD_SUFFIX="${{ matrix.artifact_prefix }}-${KSU_TAG}-kprobes${KPM_SUFFIX}"

          echo "KSUDIR=${KSU_DIR}"           >> $GITHUB_ENV
          echo "BUILDSUFFIX=${BUILD_SUFFIX}" >> $GITHUB_ENV

      # ── 6. KPM uapi headers + Dynamic Header Fixes ────────────────────────
      - name: KPM uapi headers + Dynamic Header Fixes
        if: matrix.enable_kpm == 'true'
        run: |
          # Part A: Locate and copy KPM uapi headers
          echo "==> Locating kpm.h..."
          KPM_H_PATH=$(find "$KSUDIR" -name "kpm.h" | head -n 1)
          if [ -n "$KPM_H_PATH" ]; then
            echo "Found kpm.h at: $KPM_H_PATH"
            mkdir -p include/uapi/
            cp "$KPM_H_PATH" include/uapi/
          else
            echo "WARNING: kpm.h not found in $KSUDIR"
          fi

          # Part B: Patch Makefile for KPM
          MAIN_MK="drivers/kernelsu/Makefile"
          if [ -f "${MAIN_MK}" ]; then
            if ! grep -q 'ccflags-y += -I$(srctree)/drivers/kernelsu' "${MAIN_MK}"; then
              printf '\nccflags-y += -I$(srctree)/drivers/kernelsu\n' >> "${MAIN_MK}"
            fi
          fi

          # Fix 1: ksu_cred (Dynamic Scanning)
          echo "==> Scanning for files missing ksu_cred declaration..."
          FILES_TO_PATCH_CRED=$(grep -rl 'ksu_cred' drivers/kernelsu/ | grep '\.c$' || true)
          for file in $FILES_TO_PATCH_CRED; do
            if ! grep -q 'extern struct cred \*ksu_cred' "$file"; then
              echo "==> Injecting ksu_cred forward declaration into $file"
              {
                printf '#include <linux/cred.h>   /* ksu_cred fix */\n'
                printf 'extern struct cred *ksu_cred; /* missing from ksu.h */\n'
                cat "$file"
              } > "${file}.tmp"
              mv "${file}.tmp" "$file"
            fi
          done

          # Fix 2: allow_shell / ksu_allow_shell
          echo "==> Scanning for files missing allow_shell declaration..."
          FILES_TO_PATCH_SHELL=$(grep -rlE 'allow_shell|ksu_allow_shell' drivers/kernelsu/ | grep '\.c$' || true)
          for file in $FILES_TO_PATCH_SHELL; do
            if ! grep -E -q 'extern.*allow_shell' "$file"; then
              echo "==> Injecting allow_shell forward declarations into $file"
              {
                printf '#include <linux/types.h>  /* allow_shell fix */\n'
                printf 'extern bool ksu_allow_shell;\n'
                printf 'extern bool allow_shell;\n'
                cat "$file"
              } > "${file}.tmp"
              mv "${file}.tmp" "$file"
            fi
          done

          # Fix 3: ksu_late_loaded (Dynamic Scanning for core hooks)
          echo "==> Scanning for files missing ksu_late_loaded declaration..."
          FILES_TO_PATCH_LATE=$(grep -rl 'ksu_late_loaded' drivers/kernelsu/ fs/ kernel/ | grep '\.c$' || true)
          for file in $FILES_TO_PATCH_LATE; do
            if ! grep -q 'extern bool ksu_late_loaded' "$file"; then
              echo "==> Injecting ksu_late_loaded forward declaration into $file"
              {
                printf '#include <linux/types.h>  /* ksu_late_loaded fix */\n'
                printf 'extern bool ksu_late_loaded;\n'
                cat "$file"
              } > "${file}.tmp"
              mv "${file}.tmp" "$file"
            fi
          done

      # ── 7. Apply SUSFS patches (FIXED) ────────────────────────────────────
      # FIX: Always attempt 10_enable_susfs_for_ksu.patch so that SUSFS
      #      Kconfig entries are registered. Without them, olddefconfig
      #      silently drops all CONFIG_KSU_SUSFS_* options.
      - name: Apply SUSFS patches
        run: |
          git clone --depth 1 \
            "${{ env.SUSFS_REPO }}" \
            -b "${{ env.SUSFS_BRANCH }}" \
            susfs4ksu \
            || { echo "ERROR: SUSFS clone failed."; exit 1; }

          cp susfs4ksu/kernel_patches/fs/susfs.c                fs/
          cp susfs4ksu/kernel_patches/include/linux/susfs.h     include/linux/
          cp susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/

          # Apply the main kernel SUSFS patch
          patch -p1 --forward \
            < "susfs4ksu/kernel_patches/50_add_susfs_in_${{ env.SUSFS_BRANCH }}.patch" \
            || { echo "ERROR: SUSFS kernel patch failed."; exit 1; }

          # ── FIX: Always attempt the KSU driver SUSFS Kconfig patch ──
          KSU_PATCH="susfs4ksu/kernel_patches/10_enable_susfs_for_ksu.patch"
          if [ -f "$KSU_PATCH" ]; then
            echo "==> Attempting KSU driver SUSFS integration patch..."
            if patch -p1 --forward --dry-run < "$KSU_PATCH" >/dev/null 2>&1; then
              patch -p1 --forward < "$KSU_PATCH" \
                || echo "WARNING: KSU driver patch apply failed (will inject Kconfig manually)."
              echo "==> KSU driver SUSFS patch applied successfully."
            else
              echo "==> KSU driver patch already applied or conflicts — injecting Kconfig entries manually."
            fi
          else
            echo "WARNING: $KSU_PATCH not found — will inject Kconfig entries manually."
          fi

          # ── FIX: Ensure SUSFS Kconfig entries exist in KernelSU's Kconfig ──
          KSU_KCONFIG="drivers/kernelsu/Kconfig"
          if [ -f "$KSU_KCONFIG" ]; then
            if ! grep -q 'CONFIG_KSU_SUSFS' "$KSU_KCONFIG"; then
              echo "==> SUSFS Kconfig entries missing — injecting manually..."
              cat >> "$KSU_KCONFIG" << 'KCONFIG_EOF'

          config KSU_SUSFS
              bool "Enable SUSFS for KernelSU"
              depends on KSU
              default y
              help
                Patch for SUSFS on KernelSU

          config KSU_SUSFS_HAS_MAGIC_MOUNT
              bool "Enable SUSFS has magic mount"
              depends on KSU_SUSFS
              default y

          config KSU_SUSFS_SUS_PATH
              bool "Enable SUS path"
              depends on KSU_SUSFS
              default y

          config KSU_SUSFS_SUS_MOUNT
              bool "Enable SUS mount"
              depends on KSU_SUSFS
              default y

          config KSU_SUSFS_SUS_KSTAT
              bool "Enable SUS kstat"
              depends on KSU_SUSFS
              default y

          config KSU_SUSFS_SUS_OVERLAYFS
              bool "Enable SUS overlayfs"
              depends on KSU_SUSFS
              default y

          config KSU_SUSFS_TRY_UMOUNT
              bool "Enable try umount"
              depends on KSU_SUSFS
              default y

          config KSU_SUSFS_SPOOF_UNAME
              bool "Enable spoof uname"
              depends on KSU_SUSFS
              default y

          config KSU_SUSFS_ENABLE_LOG
              bool "Enable SUSFS log"
              depends on KSU_SUSFS
              default y

          config KSU_SUSFS_OPEN_REDIRECT
              bool "Enable open redirect"
              depends on KSU_SUSFS
              default y

          config KSU_SUSFS_SUS_SU
              bool "Enable SUS su"
              depends on KSU_SUSFS
              default y
          KCONFIG_EOF
              echo "==> SUSFS Kconfig entries injected successfully."
            else
              echo "==> SUSFS Kconfig entries already present."
            fi
          else
            echo "ERROR: KernelSU Kconfig not found at $KSU_KCONFIG"
            exit 1
          fi

          rm -rf susfs4ksu

      # ── 8. Resolve kernel version and date ─────────────────────────────────
      - name: Resolve kernel version and date
        id: meta
        run: |
          KVER=$(make kernelversion 2>/dev/null | awk -F. '{print $1"."$2"."$3}')
          echo "kernelversion=${KVER}" >> $GITHUB_OUTPUT
          echo "date=$(date +%Y%m%d)"  >> $GITHUB_OUTPUT

      # ── 9. Set up swap ────────────────────────────────────────────────────
      - name: Set up swap (24 GB)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      # ── 10. Generate defconfig ─────────────────────────────────────────────
      - name: Generate defconfig
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            gki_defconfig

      # ── 11. Enable SUSFS + KPM kernel configs (FIXED) ─────────────────────
      - name: Enable SUSFS + KPM kernel configs
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"

          # FIX: Explicitly enable CONFIG_KSU first (dependency for SUSFS)
          ./scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_KSU_SUSFS \
            -e CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT \
            -e CONFIG_KSU_SUSFS_SUS_PATH \
            -e CONFIG_KSU_SUSFS_SUS_MOUNT \
            -e CONFIG_KSU_SUSFS_SUS_KSTAT \
            -e CONFIG_KSU_SUSFS_SUS_OVERLAYFS \
            -e CONFIG_KSU_SUSFS_TRY_UMOUNT \
            -e CONFIG_KSU_SUSFS_SPOOF_UNAME \
            -e CONFIG_KSU_SUSFS_ENABLE_LOG \
            -e CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            -e CONFIG_KSU_SUSFS_SUS_SU

          if [ "${{ matrix.enable_kpm }}" = "true" ]; then
            ./scripts/config --file out/.config \
              -e CONFIG_KPM \
              -e CONFIG_KALLSYMS \
              -e CONFIG_KALLSYMS_ALL
          fi

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            olddefconfig

      # ── 12. FIX: Mandatory config verification after olddefconfig ──────────
      - name: Verify kernel config (SUSFS + KPM)
        run: |
          echo "==> Verifying critical kernel config options..."
          CONFIG="out/.config"
          FAILED=0

          if grep -q 'CONFIG_KSU=y' "$CONFIG"; then
            echo "  ✅ CONFIG_KSU=y"
          else
            echo "  ❌ CONFIG_KSU=y is MISSING!"
            FAILED=1
          fi

          for opt in \
            CONFIG_KSU_SUSFS \
            CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT \
            CONFIG_KSU_SUSFS_SUS_PATH \
            CONFIG_KSU_SUSFS_SUS_MOUNT \
            CONFIG_KSU_SUSFS_SUS_KSTAT \
            CONFIG_KSU_SUSFS_SUS_OVERLAYFS \
            CONFIG_KSU_SUSFS_TRY_UMOUNT \
            CONFIG_KSU_SUSFS_SPOOF_UNAME \
            CONFIG_KSU_SUSFS_ENABLE_LOG \
            CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            CONFIG_KSU_SUSFS_SUS_SU; do
            if grep -q "${opt}=y" "$CONFIG"; then
              echo "  ✅ ${opt}=y"
            else
              echo "  ❌ ${opt}=y is MISSING!"
              FAILED=1
            fi
          done

          if [ "${{ matrix.enable_kpm }}" = "true" ]; then
            for opt in CONFIG_KPM CONFIG_KALLSYMS CONFIG_KALLSYMS_ALL; do
              if grep -q "${opt}=y" "$CONFIG"; then
                echo "  ✅ ${opt}=y"
              else
                echo "  ❌ ${opt}=y is MISSING!"
                FAILED=1
              fi
            done
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "::error::One or more required config options are MISSING after olddefconfig!"
            echo "==> Dumping all KSU/SUSFS/KPM config lines for debugging:"
            grep -E 'CONFIG_KSU|CONFIG_KPM|CONFIG_KALLSYMS' "$CONFIG" || echo "(none found)"
            exit 1
          fi

          echo ""
          echo "==> All required config options verified successfully."

      # ── 13. Upstream Refactor Fixes ────────────────────────────────────────
      - name: Patch Header Refactors
        run: |
          echo "==> Applying fixes for missing KSU identifiers..."

          sed -i '/#include <linux\/cred.h>/a \
          extern struct cred *ksu_cred;\
          extern bool allow_shell;\
          extern bool ksu_late_loaded;' include/linux/cred.h

          sed -i '/#include <linux\/types.h>/a \
          extern bool ksu_late_loaded;' include/linux/sched.h

          echo "==> Headers patched successfully."

      # ── 14. Build kernel ──────────────────────────────────────────────────
      - name: Build kernel (${{ matrix.display_name }})
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          echo "==> Compiling: ${{ matrix.display_name }} [${BUILDSUFFIX}]..."
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1

      # ── 15. FIX: Post-build verification ──────────────────────────────────
      - name: Verify SUSFS and KPM objects were compiled
        run: |
          echo "==> Post-build verification..."
          FAILED=0

          if find out/ -name "susfs.o" | grep -q .; then
            echo "  ✅ fs/susfs.o found — SUSFS was compiled into the kernel."
          else
            echo "  ❌ fs/susfs.o NOT found — SUSFS was NOT compiled!"
            FAILED=1
          fi

          if [ "${{ matrix.enable_kpm }}" = "true" ]; then
            if find out/ -path "*/kernelsu/kpm/*.o" | grep -q .; then
              echo "  ✅ KPM objects found — KPM was compiled."
            else
              echo "  ❌ KPM objects NOT found — KPM was NOT compiled!"
              FAILED=1
            fi
          fi

          if [ -f out/arch/arm64/boot/Image.gz ] || [ -f out/arch/arm64/boot/Image ]; then
            echo "  ✅ Kernel image found."
          else
            echo "  ❌ Kernel image NOT found!"
            FAILED=1
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "::error::Post-build verification FAILED! Check the build log above."
            exit 1
          fi

          echo ""
          echo "==> All post-build checks passed."

      # ── 16. Package AnyKernel3 ────────────────────────────────────────────
      - name: Package AnyKernel3 ZIP
        run: |
          cp .github/goodies/AnyKernel3.zip .
          unzip AnyKernel3.zip -d AnyKernel3
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/
          else
            echo "ERROR: No kernel Image found in out/arch/arm64/boot/"
            exit 1
          fi

      # ── 17. Upload artifact ───────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm8550-${{ steps.meta.outputs.kernelversion }}-${{ env.BUILDSUFFIX }}-susfs-${{ steps.meta.outputs.date }}
          path: AnyKernel3
          compression-level: 9
          if-no-files-found: warn
          overwrite: false
