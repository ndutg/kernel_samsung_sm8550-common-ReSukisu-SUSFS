# ============================================================
# build-kernel-sukisu-v5.yml
# SukiSU Ultra + SUSFS + Manual Hooks + KPM
# SM8550 Samsung Galaxy S23 (android13-5.15)
#
# v5 FIX: Use clean upstream kernel source (samsung-sm8550)
#   instead of ndutg fork (which has pre-baked KSU-Next hooks).
#   The SukiSU patch targets clean source — no sed needed.
# ============================================================

name: Build Kernel – SukiSU Ultra

on:
  workflow_dispatch:

env:
  KERNEL_REPO: samsung-sm8550/kernel_samsung_sm8550-common
  KERNEL_BRANCH: android13-5.15
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_BRANCH: gki-android13-5.15
  CLANG_VERSION: r584948
  SUKISU_PATCH_REPO: https://github.com/SukiSU-Ultra/SukiSU_patch.git
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: SukiSU Ultra (manual-hook)
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout CLEAN kernel source (no pre-baked hooks) ──
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          fetch-depth: 1

      # ── 2. Install build dependencies ─────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential curl flex \
            g++-multilib gcc-multilib git gnupg \
            lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libssl-dev \
            lzop zlib1g-dev pahole dwarves cpio zip \
            python3 python-is-python3 tar perl lz4 jq

      # ── 3. Restore clang toolchain cache ──────────────────────
      - name: Restore clang toolchain
        uses: actions/cache/restore@v4
        with:
          path: clang-toolchain
          key: clang-aosp-${{ env.CLANG_VERSION }}
          fail-on-cache-miss: true

      # ── 4. Verify clang ───────────────────────────────────────
      - name: Verify clang
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          clang --version || { echo "ERROR: clang not found."; exit 1; }

      # ── 5. Set up SukiSU Ultra ────────────────────────────────
      - name: Set up SukiSU Ultra
        run: |
          echo "==> Setting up SukiSU Ultra..."
          curl -sSfL --retry 3 --connect-timeout 20 \
            "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s "main" \
            || { echo "ERROR: setup.sh failed."; exit 1; }

          KSU_DIR="KernelSU"
          KSU_TAG=$(git -C "${KSU_DIR}" describe --tags --abbrev=0 2>/dev/null \
            || git -C "${KSU_DIR}" tag --list 'v[0-9]*' --sort=-v:refname \
               2>/dev/null | head -1 \
            || echo "main")

          KPM_SUFFIX=""
          if [ "true" = "true" ]; then
            KPM_SUFFIX="-kpm"
          fi

          BUILD_SUFFIX="sukisu-ultra-${KSU_TAG}-manual-hook${KPM_SUFFIX}"

          echo "KSUDIR=${KSU_DIR}"           >> $GITHUB_ENV
          echo "BUILDSUFFIX=${BUILD_SUFFIX}" >> $GITHUB_ENV

      # ── 6. Fix KPM header and declarations ────────────────────
      - name: Fix KPM header and declarations
        run: |
          echo "==> Locating kpm.h..."
          KPM_H_PATH=$(find "$KSUDIR" -name "kpm.h" | head -n 1)
          if [ -n "$KPM_H_PATH" ]; then
            echo "Found kpm.h at: $KPM_H_PATH"
            mkdir -p include/uapi/
            cp "$KPM_H_PATH" include/uapi/
          else
            echo "WARNING: kpm.h not found in $KSUDIR"
          fi

          MAIN_MK="drivers/kernelsu/Makefile"
          if [ -f "${MAIN_MK}" ]; then
            if ! grep -q 'ccflags-y += -I$(srctree)/drivers/kernelsu' "${MAIN_MK}"; then
              printf '\nccflags-y += -I$(srctree)/drivers/kernelsu\n' >> "${MAIN_MK}"
            fi
          fi

          echo "==> Scanning for files missing ksu_cred declaration..."
          FILES=$(grep -rl 'ksu_cred' drivers/kernelsu/ | grep '\.c$' || true)
          for file in $FILES; do
            if ! grep -q 'extern struct cred \*ksu_cred' "$file"; then
              { printf '#include <linux/cred.h>\nextern struct cred *ksu_cred;\n'; cat "$file"; } > "${file}.tmp"
              mv "${file}.tmp" "$file"
            fi
          done

          echo "==> Scanning for files missing allow_shell declaration..."
          FILES=$(grep -rlE 'allow_shell|ksu_allow_shell' drivers/kernelsu/ | grep '\.c$' || true)
          for file in $FILES; do
            if ! grep -E -q 'extern.*allow_shell' "$file"; then
              { printf '#include <linux/types.h>\nextern bool ksu_allow_shell;\nextern bool allow_shell;\n'; cat "$file"; } > "${file}.tmp"
              mv "${file}.tmp" "$file"
            fi
          done

          echo "==> Scanning for files missing ksu_late_loaded declaration..."
          FILES=$(grep -rl 'ksu_late_loaded' drivers/kernelsu/ fs/ kernel/ | grep '\.c$' || true)
          for file in $FILES; do
            if ! grep -q 'extern bool ksu_late_loaded' "$file"; then
              { printf '#include <linux/types.h>\nextern bool ksu_late_loaded;\n'; cat "$file"; } > "${file}.tmp"
              mv "${file}.tmp" "$file"
            fi
          done

      # ── 7. Apply SUSFS patches ────────────────────────────────
      - name: Apply SUSFS patches
        run: |
          git clone --depth 1 \
            "${{ env.SUSFS_REPO }}" \
            -b "${{ env.SUSFS_BRANCH }}" \
            susfs4ksu \
            || { echo "ERROR: SUSFS clone failed."; exit 1; }

          cp susfs4ksu/kernel_patches/fs/susfs.c                fs/
          cp susfs4ksu/kernel_patches/include/linux/susfs.h     include/linux/
          cp susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/

          patch -p1 --forward \
            < "susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch" \
            || { echo "ERROR: SUSFS kernel patch failed."; exit 1; }

          KSU_PATCH="susfs4ksu/kernel_patches/10_enable_susfs_for_ksu.patch"
          if [ -f "$KSU_PATCH" ]; then
            echo "==> Attempting KSU driver SUSFS integration patch..."
            if patch -p1 --forward --dry-run < "$KSU_PATCH" >/dev/null 2>&1; then
              patch -p1 --forward < "$KSU_PATCH" \
                || echo "WARNING: KSU driver patch apply failed (will inject Kconfig manually)."
              echo "==> KSU driver SUSFS patch applied successfully."
            else
              echo "==> KSU driver patch already applied or conflicts — injecting Kconfig entries manually."
            fi
          else
            echo "WARNING: $KSU_PATCH not found — will inject Kconfig entries manually."
          fi

          # Dynamic Kconfig injection
          KSU_KCONFIG="drivers/kernelsu/Kconfig"
          if [ -f "$KSU_KCONFIG" ]; then
            if ! grep -q 'KSU_SUSFS' "$KSU_KCONFIG"; then
              echo "==> SUSFS Kconfig entries missing — extracting from susfs headers..."
              printf '\nconfig KSU_SUSFS\n\tbool "Enable SUSFS for KernelSU"\n\tdepends on KSU\n\tdefault y\n\thelp\n\t  Patch for SUSFS on KernelSU\n' >> "$KSU_KCONFIG"
              SUSFS_OPTS=$(grep -hroE 'CONFIG_KSU_SUSFS_[A-Z_]+' susfs4ksu/kernel_patches/include/linux/susfs.h susfs4ksu/kernel_patches/fs/susfs.c 2>/dev/null | sort -u | sed 's/CONFIG_KSU_SUSFS_//')
              echo "==> Found SUSFS sub-options: $SUSFS_OPTS"
              for opt in $SUSFS_OPTS; do
                DESC=$(echo "$opt" | tr '_' ' ' | tr '[:upper:]' '[:lower:]')
                printf '\nconfig KSU_SUSFS_%s\n\tbool "Enable %s"\n\tdepends on KSU_SUSFS\n\tdefault y\n' "$opt" "$DESC" >> "$KSU_KCONFIG"
              done
              echo "==> SUSFS Kconfig entries injected dynamically."
            else
              echo "==> SUSFS Kconfig entries already present."
            fi

            if ! grep -q 'KSU_MANUAL_HOOK' "$KSU_KCONFIG"; then
              echo "==> Injecting KSU_MANUAL_HOOK Kconfig entry..."
              printf '\nconfig KSU_MANUAL_HOOK\n\tbool "Use manual inline hooks instead of kprobes"\n\tdepends on KSU\n\tdefault y\n' >> "$KSU_KCONFIG"
            fi
          else
            echo "ERROR: KernelSU Kconfig not found at $KSU_KCONFIG"
            exit 1
          fi

          rm -rf susfs4ksu

      # ════════════════════════════════════════════════════════════
      # ── 8. Apply SukiSU Ultra manual hooks patch ─────────────
      #
      #   v5: No sed cleanup needed! The clean upstream source has
      #   NO pre-baked KSU-Next hooks, so the SukiSU patch applies
      #   directly to unmodified files.
      # ════════════════════════════════════════════════════════════
      - name: Apply SukiSU Ultra manual hooks patch
        run: |
          echo "==> Downloading SukiSU Ultra official manual hooks patch..."
          git clone --depth 1 "${{ env.SUKISU_PATCH_REPO }}" sukisu_patch \
            || { echo "ERROR: SukiSU_patch clone failed."; exit 1; }

          PATCH_FILE="sukisu_patch/hooks/scope_min_manual_hooks_v1.6.patch"
          if [ ! -f "$PATCH_FILE" ]; then
            echo "ERROR: scope_min_manual_hooks_v1.6.patch not found!"
            ls -la sukisu_patch/hooks/ || true
            exit 1
          fi

          echo "==> Applying SukiSU Ultra manual hooks patch..."
          if patch -p1 --forward --fuzz=3 < "$PATCH_FILE"; then
            echo "==> SukiSU Ultra manual hooks patch applied successfully."
          else
            echo "==> Patch had conflicts — attempting with --force..."
            patch -p1 --forward --fuzz=3 --force < "$PATCH_FILE" \
              || { echo "ERROR: SukiSU Ultra manual hooks patch failed completely."; exit 1; }
            echo "==> Patch applied with --force (check for .rej files)."
            find . -name "*.rej" -exec echo "  REJECT: {}" \; -exec cat {} \;
          fi

          rm -rf sukisu_patch
          echo "==> SukiSU Ultra hook replacement complete."

      # ── 9. Extract kernel version ─────────────────────────────
      - name: Extract kernel version
        id: kver
        run: |
          KVER=$(make kernelversion 2>/dev/null | awk -F. '{print $1"."$2"."$3}')
          echo "kernelversion=${KVER}" >> $GITHUB_OUTPUT
          echo "date=$(date +%Y%m%d)"  >> $GITHUB_OUTPUT

      # ── 10. Set swap space ────────────────────────────────────
      - name: Set swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      # ── 11. Generate defconfig ────────────────────────────────
      - name: Generate defconfig
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            gki_defconfig

      # ── 12. Enable config options ─────────────────────────────
      - name: Enable KSU + SUSFS + KPM config options
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"

          ./scripts/config --file out/.config -e CONFIG_KSU
          ./scripts/config --file out/.config -e CONFIG_KSU_MANUAL_HOOK

          KSU_KCONFIG="drivers/kernelsu/Kconfig"
          echo "==> Dynamically enabling all SUSFS config options..."
          grep -oE '^config KSU_SUSFS[A-Z_]*' "$KSU_KCONFIG" | while read -r line; do
            OPT="CONFIG_${line#config }"
            echo "  Enabling $OPT"
            ./scripts/config --file out/.config -e "$OPT"
          done

          if [ "true" = "true" ]; then
            ./scripts/config --file out/.config \
              -e CONFIG_KPM \
              -e CONFIG_KALLSYMS \
              -e CONFIG_KALLSYMS_ALL
          fi

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            olddefconfig

      # ── 13. Verify config ─────────────────────────────────────
      - name: Verify kernel config
        run: |
          echo "==> Verifying kernel config options..."
          CONFIG="out/.config"
          KSU_KCONFIG="drivers/kernelsu/Kconfig"
          FAILED=0

          if grep -q 'CONFIG_KSU=y' "$CONFIG"; then
            echo "  ✅ CONFIG_KSU=y"
          else
            echo "  ❌ CONFIG_KSU=y is MISSING!"
            FAILED=1
          fi

          if grep -q 'CONFIG_KSU_SUSFS=y' "$CONFIG"; then
            echo "  ✅ CONFIG_KSU_SUSFS=y"
          else
            echo "  ❌ CONFIG_KSU_SUSFS=y is MISSING!"
            FAILED=1
          fi

          echo "  --- SUSFS sub-options ---"
          grep -oE '^config KSU_SUSFS_[A-Z_]+' "$KSU_KCONFIG" | while read -r line; do
            OPT="CONFIG_${line#config }"
            if grep -q "${OPT}=y" "$CONFIG"; then
              echo "  ✅ ${OPT}=y"
            else
              echo "  ⚠️  ${OPT}=y not set (may have been dropped by olddefconfig)"
            fi
          done

          echo "  --- Hook mode ---"
          if grep -q 'CONFIG_KSU_MANUAL_HOOK=y' "$CONFIG"; then
            echo "  ✅ CONFIG_KSU_MANUAL_HOOK=y (inline hook mode)"
          else
            echo "  ⚠️  CONFIG_KSU_MANUAL_HOOK not set"
          fi

          if [ "true" = "true" ]; then
            echo "  --- KPM options ---"
            for opt in CONFIG_KPM CONFIG_KALLSYMS CONFIG_KALLSYMS_ALL; do
              if grep -q "${opt}=y" "$CONFIG"; then
                echo "  ✅ ${opt}=y"
              else
                echo "  ❌ ${opt}=y is MISSING!"
                FAILED=1
              fi
            done
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "::error::One or more CRITICAL config options are MISSING!"
            grep -E 'CONFIG_KSU|CONFIG_KPM|CONFIG_KALLSYMS' "$CONFIG" || echo "(none found)"
            exit 1
          fi

          echo ""
          echo "==> Config verification complete."

      # ── 14. Patch headers for missing identifiers ─────────────
      - name: Patch headers for missing identifiers
        run: |
          echo "==> Applying fixes for missing KSU identifiers..."
          sed -i '/#include <linux\/cred.h>/a \
          extern struct cred *ksu_cred;\
          extern bool allow_shell;\
          extern bool ksu_late_loaded;' include/linux/cred.h

          sed -i '/#include <linux\/types.h>/a \
          extern bool ksu_late_loaded;' include/linux/sched.h
          echo "==> Headers patched successfully."

      # ── 15. Build kernel ──────────────────────────────────────
      - name: Build kernel
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          echo "==> Compiling: SukiSU Ultra [${BUILDSUFFIX}]..."
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1

      # ── 16. Package output ────────────────────────────────────
      - name: Package kernel image
        run: |
          echo "==> Packaging kernel..."
          KERNEL_IMG="out/arch/arm64/boot/Image"
          if [ ! -f "$KERNEL_IMG" ]; then
            echo "ERROR: Kernel image not found!"
            exit 1
          fi
          mkdir -p upload
          cp "$KERNEL_IMG" upload/
          find out/arch/arm64/boot -name "*.dtb" -exec cp {} upload/ \; 2>/dev/null || true
          find out/arch/arm64/boot -name "*.dtbo" -exec cp {} upload/ \; 2>/dev/null || true
          echo "==> Kernel packaged."

      # ── 17. Upload artifact ───────────────────────────────────
      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.BUILDSUFFIX }}-${{ steps.kver.outputs.kernelversion }}-${{ steps.kver.outputs.date }}
          path: upload/
